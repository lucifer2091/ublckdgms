

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

html, body {
  font-size: 12px;
  background: #080a14;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

#root {
  position: relative;
  z-index: 1;
}

/* FULLSCREEN LOADING */
#game-loading {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 50% 45%,
      rgba(88, 42, 180, 0.25),
      transparent 55%
    ),
    linear-gradient(
      145deg,
      #080a15,
      #10112a 50%,
      #080a15
    );

  opacity: 1;
  visibility: visible;
  transition:
    opacity 0.65s ease,
    visibility 0.65s ease;
}

#game-loading.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* BACKGROUND GLOW */
#game-loading::before {
  content: "";
  position: absolute;
  width: 550px;
  height: 550px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(113, 65, 255, 0.14),
    transparent 65%
  );
  filter: blur(30px);
  animation: backgroundPulse 4s ease-in-out infinite;
}

.loading-center {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

/* LOGO AREA */
.logo-container {
  position: relative;
  width: 170px;
  height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* OUTER RING */
.ring-outer {
  position: absolute;
  inset: 0;
  border-radius: 50%;

  border: 2px solid transparent;
  border-top-color: #a78bfa;
  border-right-color: rgba(167, 139, 250, 0.35);

  box-shadow:
    0 0 22px rgba(139, 92, 246, 0.12),
    inset 0 0 15px rgba(139, 92, 246, 0.08);

  animation: spin 3s linear infinite;
}

/* INNER RING */
.ring-inner {
  position: absolute;
  inset: 12px;
  border-radius: 50%;

  border: 2px solid transparent;
  border-bottom-color: #6366f1;
  border-left-color: rgba(99, 102, 241, 0.4);

  animation: spinReverse 2.4s linear infinite;
}

/* G+ LOGO */
.gplus {
  position: relative;
  z-index: 2;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 65px;
  font-weight: 900;
  letter-spacing: -5px;
  line-height: 1;

  background: linear-gradient(
    135deg,
    #ffffff 10%,
    #d8c7ff 45%,
    #8b5cf6 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  filter: drop-shadow(
    0 0 18px rgba(160, 110, 255, 0.45)
  );

  animation: logoPulse 2.5s ease-in-out infinite;
}

/* PROGRESS BAR */
.loading-bar {
  position: relative;
  width: 230px;
  height: 5px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(255,255,255,0.09);
  box-shadow: 0 0 15px rgba(139,92,246,0.1);
}

.loading-progress {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 40%;
  border-radius: 20px;

  background: linear-gradient(
    90deg,
    #6366f1,
    #a78bfa,
    #e0d4ff
  );

  box-shadow:
    0 0 12px #8b5cf6,
    0 0 25px rgba(139,92,246,0.5);

  animation: loadingMove 1.7s ease-in-out infinite;
}

/* ANIMATIONS */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}

@keyframes logoPulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.95;
  }
  50% {
    transform: scale(1.06);
    opacity: 1;
  }
}

@keyframes backgroundPulse {
  0%, 100% {
    transform: scale(0.9);
    opacity: 0.65;
  }
  50% {
    transform: scale(1.15);
    opacity: 1;
  }
}

@keyframes loadingMove {
  0% {
    left: -45%;
  }
  50% {
    left: 45%;
  }
  100% {
    left: 105%;
  }
}

@media (max-width: 600px) {
  .logo-container {
    width: 145px;
    height: 145px;
  }

  .gplus {
    font-size: 57px;
  }

  .loading-bar {
    width: 190px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ring-outer,
  .ring-inner,
  .gplus,
  .loading-progress,
  #game-loading::before {
    animation: none;
  }

  .loading-progress {
    width: 100%;
  }
}
</style>

<script
  type="module"
  crossorigin="anonymous"
  src="https://cdn.jsdelivr.net/gh/teamschoolcomu/2@main/index-Bsf2IdFa.js">
</script>

</head>

<body>

<!-- LOADING SCREEN -->
<div id="game-loading" role="status" aria-label="Loading game">
  <div class="loading-center">

    <div class="logo-container">
      <div class="ring-outer"></div>
      <div class="ring-inner"></div>
      <div class="gplus">G+</div>
    </div>

    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>

  </div>
</div>

<!-- GAME ROOT -->
<div id="root"></div>

<script>
(function () {
  const loader = document.getElementById("game-loading");
  const root = document.getElementById("root");

  const startedAt = performance.now();
  const minimumDuration = 900;

  let finished = false;

  function hideLoader() {
    if (finished) return;
    finished = true;

    const elapsed = performance.now() - startedAt;
    const remaining = Math.max(0, minimumDuration - elapsed);

    setTimeout(() => {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          loader.classList.add("hidden");

          setTimeout(() => {
            loader.remove();
          }, 750);
        });
      });
    }, remaining);
  }

  function checkGame() {
    // Hide when React mounts the game interface.
    if (root.children.length > 0) {
      observer.disconnect();
      hideLoader();
    }
  }

  const observer = new MutationObserver(checkGame);

  observer.observe(root, {
    childList: true,
    subtree: true
  });

  checkGame();
})();
</script>
<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: 'â'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbzNG4z_PlG6Ke_bX5wSPKK2uBRB3IY9ouVzqM1shucYhSTvsJWRmyMyZaaC2z5S3ADN/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close â';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
</body>
</html>
