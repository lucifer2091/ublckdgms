<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Melon Drop</title>
<style>
  html, body { margin: 0; height: 100%; background: #231F20; overflow: hidden; }
  #unity-canvas { display: block; width: 100%; height: 100%; background: #231F20; }
  #cover {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #231F20; color: #d7d2c8;
    font: 500 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
    transition: opacity .35s linear;
  }
  #cover.gone { opacity: 0; pointer-events: none; }
  #track { width: min(16rem, 55vw); height: 3px; margin: .85rem auto 0; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
  #track i { display: block; height: 100%; width: 0; background: #9bd07a; transition: width .2s linear; }
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="cover"><div><div>melon drop</div><div id="track"><i></i></div></div></div>
<script>
  // the unity build lives in a jsdelivr repo, so the game runs from our own
  // page without touching a blocked host
  var build = 'https://cdn.jsdelivr.net/gh/fedosyamamontova/httplibrary@8fe6115615b43b568799e1ed0c488b79f42d6a18/src/main/java/com/github/kevinsawicki/http';
  var config = {
    dataUrl: build + '/4858d9a4114c0990198ad297b332e984.data.unityweb',
    frameworkUrl: build + '/b0f36479ff927d2218e80f647cdffd93.js.unityweb',
    codeUrl: build + '/7e2da19953030ead73bcedf2fd8c2f70.wasm.unityweb'
  };
  var canvas = document.getElementById('unity-canvas');
  var cover = document.getElementById('cover');
  var bar = document.querySelector('#track i');
  var s = document.createElement('script');
  s.src = build + '/b0ba270e6a29211019a99342b797af52.js';
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      bar.style.width = (100 * p) + '%';
    }).then(function () {
      cover.classList.add('gone');
    }).catch(function () {
      cover.textContent = 'this one would not start';
    });
  };
  s.onerror = function () { cover.textContent = 'this one would not start'; };
  document.body.appendChild(s);
</script>
</body>
</html>
