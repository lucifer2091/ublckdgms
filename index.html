<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17140f">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('backpage:theme'); } catch (e) {}
  var dark = t !== 'light';
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f4ee');
})();
</script>
<title>Backpage</title>
<style>
:root{
  color-scheme:light;
  --paper:#f7f4ee;
  --card:#fffdf9;
  --ink:#1a1917;
  --muted:#6f6961;
  --faint:#a49c90;
  --rule:#e2dbcf;
  --edge:#cdc3b2;
  --hover:#ffffff;
  --press:#f2ece0;
  --focus:#c2b7a4;
  --dot:#cec5b6;
  --wash:#f8e9df;
  --sel:#eadfc9;
  --accent:#b4451f;
  --serif:Georgia,"Iowan Old Style","Times New Roman",Times,serif;
  --head:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --fast:120ms;
  --ease:cubic-bezier(.2,.65,.3,1);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --paper:#17140f;
  --card:#1e1a14;
  --ink:#e7dfd1;
  --muted:#b0a494;
  --faint:#877c6c;
  --rule:#332c23;
  --edge:#4a4034;
  --hover:#24201a;
  --press:#2a251d;
  --focus:#574a3a;
  --dot:#453d31;
  --wash:#33241b;
  --sel:#3a3126;
  --accent:#dd8a62;
}
*{box-sizing:border-box}
html{
  font-size:clamp(87.5%, 0.3vw + 80.6%, 112.5%);
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:400 1rem/1.6 var(--serif);
  -webkit-font-smoothing:antialiased;
  animation:settle .18s ease-out both;
}
@keyframes settle{from{opacity:0}to{opacity:1}}

.wrap{
  max-width:74rem;
  margin:0 auto;
  padding:0 clamp(16px, 2.4vw, 40px);
}
a{color:inherit}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{border-bottom:1px solid var(--rule)}
.top{
  display:flex;align-items:baseline;flex-wrap:wrap;
  gap:clamp(10px, .9rem, 20px);
  padding:clamp(12px, 1.1rem, 20px) 0 clamp(11px, 1rem, 18px);
}
.brand{
  font-family:var(--head);
  font-size:1.35rem;font-weight:700;letter-spacing:-.005em;
}
.brand i{font-style:normal;color:var(--accent)}
.top .grow{flex:1 1 1rem}
.count{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;color:var(--faint);white-space:nowrap;
  transition:opacity var(--fast) linear;
}
.shift{
  display:inline-flex;align-items:center;gap:.45rem;
  background:none;border:0;padding:0;margin:0;cursor:pointer;
  font:inherit;font-style:italic;font-size:.78rem;
  color:var(--faint);white-space:nowrap;
  transition:color var(--fast) linear;
}
.shift:hover{color:var(--muted)}
.shift[aria-pressed="true"]{color:var(--muted)}
.shift .track{
  position:relative;flex:none;
  width:1.9rem;height:1.05rem;
  border:1px solid var(--rule);border-radius:2px;
  background:var(--card);
  transition:background-color 160ms linear,border-color 160ms linear;
}
.shift .knob{
  position:absolute;top:2px;left:2px;
  width:calc(1.05rem - 6px);height:calc(1.05rem - 6px);
  border-radius:1px;background:var(--faint);
  transition:transform 180ms var(--ease),background-color 160ms linear;
}
.shift:hover .track{border-color:var(--edge)}
.shift[aria-pressed="true"] .track{background:var(--wash);border-color:var(--accent)}
.shift[aria-pressed="true"] .knob{transform:translateX(.85rem);background:var(--accent)}
.search input{
  width:clamp(130px, 18vw, 220px);
  padding:.34rem .5rem;
  border:1px solid var(--rule);border-radius:3px;
  background:var(--card);color:var(--ink);
  font:inherit;font-size:.84rem;outline:none;
  transition:border-color var(--fast) linear, background-color var(--fast) linear;
}
.search input:focus{border-color:var(--focus);background:var(--hover)}
.search input::placeholder{color:var(--faint)}

.intro{padding:clamp(24px, 2.3rem, 40px) 0 .25rem;max-width:40rem}
.intro p{margin:0 0 .6rem;color:var(--muted);font-size:.97rem;line-height:1.66}
.stamp{
  font-family:var(--serif);font-style:italic;
  font-size:.8rem;color:var(--faint);
}

.recent{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .55rem;
  margin:clamp(14px,1.4rem,24px) 0 0;
}
.recent[hidden]{display:none}
.recent-lab{font-style:italic;font-size:.78rem;color:var(--faint)}
.recent-list{display:flex;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.recent-list li{margin:0}
.recent-list li + li::before{content:"\00b7";color:var(--dot);padding:0 .5rem}
.recent-list a{
  color:var(--muted);text-decoration:none;font-size:.86rem;
  transition:color var(--fast) linear;
}
.recent-list a:hover{color:var(--ink)}

.filters{
  display:flex;flex-wrap:wrap;
  margin:clamp(18px, 1.7rem, 30px) 0 clamp(22px, 2rem, 36px);
  padding:0;list-style:none;
}
.filters li{margin:0 0 .38rem;white-space:nowrap}
.filters li:not(:last-child)::after{content:"\00b7";color:var(--dot);padding:0 .62rem}
.filters li + li::before{content:none}
.filters button{
  background:none;border:0;padding:0 0 1px;margin:0;cursor:pointer;
  font:inherit;font-size:.87rem;color:var(--muted);
  transition:color var(--fast) linear;
}
.filters button:hover{color:var(--ink)}
.filters button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -1px 0 var(--accent)}
.filters .shuffle{font-style:italic;color:var(--faint)}
.filters .shuffle:hover{color:var(--ink)}
.filters .shuffle:disabled{opacity:.4;cursor:default}
.filters .shuffle:disabled:hover{color:var(--faint)}

.sect{margin:0 0 clamp(24px, 2.3rem, 40px)}
.sect-head{display:flex;align-items:baseline;gap:.55rem;margin:0 0 .7rem}
.sect-head h2{
  margin:0;font-family:var(--head);
  font-size:1rem;font-weight:700;letter-spacing:.005em;
}
.sect-head .n{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;color:var(--faint);
}
.sect-head .rule{flex:1;height:1px;background:var(--rule);transform:translateY(-.25rem)}

.grid{
  display:flex;flex-wrap:wrap;align-items:stretch;
  gap:.5rem;
}
.card{
  position:relative;display:block;
  flex:0 1 auto;
  width:calc(7.4rem + var(--chars) * .40rem);
  min-width:13.6rem;max-width:26.5rem;
  aspect-ratio:3.15/1;
  min-height:5.2rem;max-height:9.4rem;
  border-radius:3px;
  background:#12141a;
  text-decoration:none;
  overflow:hidden;
  isolation:isolate;
  transition:box-shadow 150ms linear;
}
.card:hover{box-shadow:0 0 0 1px rgba(232,225,210,.30)}
.card:active{box-shadow:0 0 0 1px rgba(232,225,210,.45)}

.card__in{
  position:relative;display:block;width:100%;height:100%;
  container-type:inline-size;
}

.card__art{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:saturate(.88) contrast(1.04) brightness(.96);
  transition:filter 160ms linear;
}
.card:hover .card__art{filter:saturate(.96) contrast(1.05) brightness(1.03)}

/* scrim: darkens the left where the title sits, and the outer edges */
.card::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(8,9,12,.90) 0%, rgba(8,9,12,.84) 34%, rgba(8,9,12,.70) 54%, rgba(8,9,12,.42) 66%, rgba(8,9,12,.20) 80%, rgba(8,9,12,.58) 100%),
    radial-gradient(42% 100% at 94% 50%, rgba(8,9,12,.76) 0%, rgba(8,9,12,.50) 55%, rgba(8,9,12,0) 100%),
    linear-gradient(0deg, rgba(8,9,12,.62) 0%, rgba(8,9,12,0) 42%, rgba(8,9,12,.22) 100%);
  box-shadow:inset 0 0 2.2rem rgba(0,0,0,.55);
}
.card.plate::before{
  background:radial-gradient(130% 150% at 18% 46%, rgba(62,58,50,.52) 0%, rgba(24,21,17,.72) 52%, rgba(12,10,8,.92) 100%);
}
.card.plate{background:radial-gradient(120% 130% at 24% 42%, #2b2721 0%, #1a1713 48%, #0e0c0a 100%)}

/* on phones the banners run full width, like the reference */
@media (max-width:560px){
  .card{flex:1 1 100%;width:100%;min-width:0;max-width:none}
}

/* frame: 9-slice so corners stay crisp at any width */
.card__f{
  position:absolute;z-index:3;pointer-events:none;
  inset:clamp(3px, 1.9cqw, 9px);
  border:12px solid transparent;
  border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23eae3d4' stroke-width='1.45' stroke-linecap='round'><path d='M6.2 .5H41.8A5.7 5.7 0 0 1 47.5 6.2V41.8A5.7 5.7 0 0 1 41.8 47.5H6.2A5.7 5.7 0 0 1 .5 41.8V6.2A5.7 5.7 0 0 1 6.2 .5Z'/><path stroke-width='.95' d='M6.2 3.5H41.8A2.7 2.7 0 0 1 44.5 6.2V41.8A2.7 2.7 0 0 1 41.8 44.5H6.2A2.7 2.7 0 0 1 3.5 41.8V6.2A2.7 2.7 0 0 1 6.2 3.5Z' opacity='.22'/></svg>") 16 fill / 1 / 0 stretch;
  opacity:.82;
  transition:opacity 150ms linear;
}
.card:hover .card__f{opacity:1}

/* small jewels straddling the frame at top and bottom centre */
.card__f::before,.card__f::after{
  content:"";position:absolute;left:50%;
  width:.3rem;height:.3rem;
  background:rgba(234,227,212,.8);
  transform:translateX(-50%) rotate(45deg);
}
.card__f::before{top:-.24rem}
.card__f::after{bottom:-.24rem}

.card__t{
  position:absolute;z-index:2;
  left:.95rem;right:34%;top:50%;
  transform:translateY(-50%);
  margin:0;
  font-family:var(--head);
  font-size:clamp(.88rem, 5.4cqw, 1.5rem);
  font-weight:500;line-height:1.14;letter-spacing:.008em;
  color:#f1ebdf;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.55);
  overflow-wrap:break-word;
  text-wrap:pretty;
}
.nw{white-space:nowrap}
.card__s{
  position:absolute;z-index:2;
  right:.95rem;top:50%;transform:translateY(-50%);
  font-family:var(--serif);font-style:italic;
  font-size:clamp(.68rem, 2.75cqw, .86rem);
  color:rgba(241,235,223,.92);
  white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.7);
  transition:color 150ms linear;
}
.card:hover .card__s{color:rgba(241,235,223,.82)}
.card.dl .card__s{color:#e8a07a}

.card__mark{
  position:absolute;z-index:0;
  right:.3rem;bottom:-.28em;
  font-family:var(--head);font-weight:700;
  font-size:clamp(3.6rem, 26cqw, 7rem);
  line-height:.8;
  color:rgba(232,225,210,.11);
  letter-spacing:-.02em;
  user-select:none;
}
.card.plate .card__mark{z-index:2;color:rgba(232,225,210,.10)}

.card.dl .card__t::after{
  content:"\2193";color:#e8a07a;margin-left:.28rem;font-size:.8em;
  display:inline-block;
  transition:transform var(--fast) var(--ease);
}
.card.dl:hover .card__t::after{transform:translateY(.12em)}

.empty{padding:2.8rem 0 3.6rem;color:var(--faint);font-size:.9rem;display:none}

main.wrap{padding-bottom:clamp(30px, 3.2rem, 60px)}

#overlay{
  position:fixed;inset:0;height:100dvh;z-index:50;
  display:flex;flex-direction:column;background:#101010;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .16s ease-out, visibility 0s linear .16s;
}
#overlay.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .16s ease-out;
}
.ov-bar{
  display:flex;align-items:center;gap:1rem;
  padding:.55rem 1rem;
  border-bottom:1px solid #242424;background:#171717;color:#e9e5dd;
  font-size:.8rem;
  transform:translateY(-.45rem);
  transition:transform .16s var(--ease);
}
#overlay.open .ov-bar{transform:none}
.ov-title{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:.5rem;
  font-family:var(--head);font-size:.97rem;
}
.ov-title #ovName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-note{
  flex:none;font-family:var(--serif);font-style:italic;
  font-size:.76rem;color:#8a847b;
}
.ov-note[hidden]{display:none}
.ov-bar a,.ov-bar button{
  background:none;border:0;padding:0;cursor:pointer;font:inherit;
  color:#a39d94;text-decoration:none;white-space:nowrap;
  transition:color var(--fast) linear;
}
.ov-bar a:hover,.ov-bar button:hover{color:#fff}
.ov-bar button.done{color:#e9e5dd}
#frame{
  flex:1;width:100%;border:0;background:#000;
  opacity:0;transition:opacity .2s ease-out;
}
#frame.ready{opacity:1}
body.locked{overflow:hidden}

@media (max-width:560px){
  .top .grow{display:none}
  .search{flex:1 1 100%;order:3}
  .search input{width:100%}
  .ov-bar{gap:.7rem;font-size:.72rem}
  #ovFull{display:none}
}

html.theming body,html.theming body *{
  transition:background-color .22s linear,border-color .22s linear,color .22s linear !important;
}
html.theming .shift .knob{transition:transform 180ms var(--ease),background-color .22s linear !important}
html.theming #overlay,html.theming #overlay *{transition:none !important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <div class="brand">Backpage<i>.</i></div>
    <div class="grow"></div>
    <div class="count" id="count"></div>
    <button class="shift" id="shift" type="button" aria-pressed="false"><span class="track"><span class="knob"></span></span><span>night shift</span></button>

  <div class="recent" id="recent" hidden>

    <ul class="recent-list" id="recentList"></ul>

<div id="overlay">

    <button id="ovFull" type="button">fullscreen</button>
    <a id="ovNew" target="_blank" rel="noopener noreferrer">new tab</a>
    <button id="ovClose" type="button">close</button>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write; encrypted-media" allowfullscreen></iframe>
</div>

const ORDER = ["Action \u0026 Shooters","Deltarune","Emulators","Five Nights at Freddy\u0027s","Flash Classics","Horror","Kindergarten","Minecraft","Platformers","Puzzle \u0026 Strategy","Racing \u0026 Sports","RPG \u0026 Story","Simulation \u0026 Idle","Territorial.io","Vex","Download Only"];

let group = 'All', term = '';
let settleNext = false;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const listEl = $('sections'), emptyEl = $('empty'), countEl = $('count'), filterEl = $('filters');
const overlay = $('overlay'), frame = $('frame'), ovName = $('ovName'), ovNote = $('ovNote'), ovNew = $('ovNew');
const ovCopy = $('ovCopy'), ovFull = $('ovFull');
const RECENT_KEY = 'backpage:recent';

const PRESENT = ORDER.filter(g => GAMES.some(x => x.g === g));

['All'].concat(PRESENT).forEach((name, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = name === 'All' ? 'all' : name;
  if (i === 0) b.className = 'on';
  b.onclick = () => {
    group = name;
    filterEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    settleNext = true;
    render();
  };
  li.appendChild(b);
  filterEl.appendChild(li);
});

const shuffleLi = document.createElement('li');
const shuffleBtn = document.createElement('button');
shuffleBtn.type = 'button';
shuffleBtn.className = 'shuffle';
shuffleBtn.textContent = 'shuffle';
shuffleBtn.title = 'pick one at random';
shuffleBtn.onclick = () => {
  const q = term.trim().toLowerCase();
  const pool = GAMES.filter(x => !x.d && (group === 'All' || x.g === group) && matches(x, q));
  if (!pool.length) return;
  openGame(pool[Math.floor(Math.random() * pool.length)]);
};
shuffleLi.appendChild(shuffleBtn);
filterEl.appendChild(shuffleLi);

function matches(x, q) {
  if (!q) return true;
  return x.n.toLowerCase().includes(q) || x.g.toLowerCase().includes(q);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// keep a trailing parenthetical like "(Client / WASM)" on one line
function titleHtml(n) {
  const i = n.indexOf(' (');
  if (i > 0) return escapeHtml(n.slice(0, i)) + ' <span class="nw">' + escapeHtml(n.slice(i + 1)) + '</span>';
  return escapeHtml(n);
}

function render() {
  const q = term.trim().toLowerCase();
  listEl.innerHTML = '';
  let shown = 0;

  ORDER.forEach(g => {
    if (group !== 'All' && group !== g) return;
    const items = GAMES.filter(x => x.g === g && matches(x, q));
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement('section');
    sec.className = 'sect';

    const head = document.createElement('div');
    head.className = 'sect-head';
    head.innerHTML = '<h2>' + escapeHtml(g) + '</h2><span class="n">' + items.length + '</span><span class="rule"></span>';

    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(x => {
      const a = document.createElement('a');
      const art = !!x.i;
      a.className = 'card' + (x.d ? ' dl' : '') + (art ? '' : ' plate');
      a.href = x.u;
      a.style.setProperty('--chars', Math.min(46, x.n.length));

      let inner = '';
      if (art) {
        inner += '<span class="card__art" style="background-image:url(images/cards/' + x.i + '.jpg)"></span>';
      }
      inner += '<span class="card__t">' + titleHtml(x.n) + '</span>';
      inner += '<span class="card__s">' + (x.d ? 'download' : (x.s < 1 ? '&lt;1 mb' : x.s + ' mb')) + '</span>';
      inner += '<span class="card__f"></span>';

      const box = document.createElement('span');
      box.className = 'card__in';
      box.innerHTML = inner;
      a.appendChild(box);

      if (x.d) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      } else {
        a.onclick = ev => { ev.preventDefault(); openGame(x); };
      }
      grid.appendChild(a);
    });

    sec.appendChild(head);
    sec.appendChild(grid);
    listEl.appendChild(sec);
  });

  emptyEl.style.display = shown ? 'none' : 'block';
  countEl.textContent = shown === GAMES.length ? GAMES.length + ' games' : shown + ' of ' + GAMES.length;

  const pool = GAMES.filter(x => !x.d && (group === 'All' || x.g === group) && matches(x, q));
  shuffleBtn.disabled = pool.length === 0;

  if (settleNext && !REDUCED) {
    listEl.animate(
      [{ opacity: .55 }, { opacity: 1 }],
      { duration: 140, easing: 'ease-out' }
    );
  }
  settleNext = false;
  fitTitles();
  renderRecent();
}

function fitTitles() {
  const titles = listEl.querySelectorAll('.card__t');
  for (let i = 0; i < titles.length; i++) {
    const t = titles[i];
    t.style.fontSize = '';
    let guard = 0;
    while (guard++ < 8) {
      const cs = getComputedStyle(t);
      const lh = parseFloat(cs.lineHeight);
      const h = t.getBoundingClientRect().height;
      if (!lh || h <= lh * 2 + 1) break;
      const fs = parseFloat(cs.fontSize);
      if (fs <= 10.6) break;
      const factor = Math.max(0.72, Math.min(0.97, (lh * 2) / h));
      t.style.fontSize = Math.max(10.6, fs * factor) + 'px';
    }
  }
}

let fitTimer = 0;
addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitTitles, 120);
});

function readRecent() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.filter(n => GAMES.some(g => g.n === n && !g.d));
  } catch (e) {
    return [];
  }
}

function pushRecent(name) {
  const list = readRecent().filter(n => n !== name);
  list.unshift(name);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch (e) {}
  renderRecent();
}

function renderRecent() {
  const list = readRecent();
  const show = list.length > 0 && group === 'All' && !term.trim();
  $('recent').hidden = !show;
  if (!show) return;

  const ul = $('recentList');
  ul.innerHTML = '';
  list.forEach(n => {
    const x = GAMES.find(g => g.n === n);
    if (!x) return;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = x.u;
    a.textContent = n;
    a.onclick = ev => { ev.preventDefault(); openGame(x); };
    li.appendChild(a);
    ul.appendChild(li);
  });
}

let closeTimer = null;
let fadeTimer = null;

function openGame(x) {
  clearTimeout(closeTimer);
  clearTimeout(fadeTimer);
  ovName.textContent = x.n;
  ovNote.hidden = false;
  ovNew.href = x.u;
  frame.classList.remove('ready');
  frame.src = x.u;
  overlay.classList.add('open');
  document.body.classList.add('locked');
  fadeTimer = setTimeout(() => frame.classList.add('ready'), 350);
  history.replaceState(null, '', '#play=' + encodeURIComponent(x.n));
  pushRecent(x.n);
}

function closeGame() {
  clearTimeout(fadeTimer);
  overlay.classList.remove('open');
  ovNote.hidden = true;
  document.body.classList.remove('locked');
  frame.classList.remove('ready');
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => { frame.src = 'about:blank'; }, REDUCED ? 0 : 180);
  history.replaceState(null, '', location.pathname + location.search);
}

$('ovClose').onclick = closeGame;

frame.addEventListener('load', () => {
  ovNote.hidden = true;
  if (overlay.classList.contains('open')) frame.classList.add('ready');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (overlay.classList.contains('open')) closeGame();
    else if (document.activeElement === $('q') && term) {
      $('q').value = '';
      term = '';
      render();
    }
  }
  if (e.key === '/' && document.activeElement !== $('q')) {
    e.preventDefault();
    $('q').focus();
  }
});

$('q').addEventListener('input', e => { term = e.target.value; render(); });

let copyTimer = null;
ovCopy.onclick = () => {
  const url = location.href;
  const done = () => {
    ovCopy.textContent = 'copied';
    ovCopy.classList.add('done');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      ovCopy.textContent = 'copy link';
      ovCopy.classList.remove('done');
    }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, fallback);
  } else {
    fallback();
  }
};

if (!frame.requestFullscreen && !frame.webkitRequestFullscreen) {
  ovFull.hidden = true;
} else {
  ovFull.onclick = () => {
    const el = document.fullscreenElement || document.webkitFullscreenElement;
    if (el) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return;
    }
    const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
    try {
      const p = req.call(frame);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  };
}

function openFromHash() {
  const m = /^#play=(.+)$/.exec(location.hash);
  if (!m) return;
  let name = '';
  try { name = decodeURIComponent(m[1]); } catch (e) { return; }
  const x = GAMES.find(g => g.n === name);
  if (x && !x.d) openGame(x);
}

window.addEventListener('hashchange', () => {
  if (!overlay.classList.contains('open')) openFromHash();
});

const shiftBtn = $('shift');
const rootEl = document.documentElement;
const themeMeta = document.querySelector('meta[name="theme-color"]');
const THEME_KEY = 'backpage:theme';
let themeTimer = null;

function isNight() {
  return rootEl.getAttribute('data-theme') === 'dark';
}

function syncShift() {
  shiftBtn.setAttribute('aria-pressed', isNight() ? 'true' : 'false');
  if (themeMeta) themeMeta.setAttribute('content', isNight() ? '#17140f' : '#f7f4ee');
}

shiftBtn.onclick = () => {
  const dark = !isNight();
  if (dark) rootEl.setAttribute('data-theme', 'dark');
  else rootEl.removeAttribute('data-theme');

  try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}

  syncShift();

  if (!REDUCED) {
    rootEl.classList.add('theming');
    clearTimeout(themeTimer);
    themeTimer = setTimeout(() => rootEl.classList.remove('theming'), 280);
  }
};

syncShift();

render();
openFromHash();
</script>
</body>
</html>
