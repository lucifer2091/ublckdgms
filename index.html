<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>UNBLOCKED GAMES</title>
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151d; --panel2:#1c1c26; --line:#26262f;
    --txt:#f2f0ea; --dim:#8f8a9c; --dimmer:#5f5b6b; --acc:#ff8a3d; --acc2:#ffc247;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh; overflow-x:hidden;
    background-image:radial-gradient(900px 500px at 15% -10%,rgba(255,138,61,.10),transparent 60%),
                     radial-gradient(700px 400px at 90% 0%,rgba(124,92,255,.07),transparent 60%);
    background-attachment:fixed;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}
  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:rgba(11,11,15,.80);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:18px;padding:15px 0;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.02em;font-size:1.12rem}
  .logo .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    box-shadow:0 0 16px rgba(255,138,61,.6)}
  .logo span{color:var(--acc)}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 37px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:.9rem;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,138,61,.12)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
  .count{font-size:.75rem;color:var(--dimmer);white-space:nowrap;font-variant-numeric:tabular-nums}
  main{padding:32px 0 40px}
  .hero h1{font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.02;letter-spacing:-.04em;font-weight:900}
  .hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--acc),var(--acc2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--dim);margin-top:9px;font-size:.9rem;max-width:600px;line-height:1.55}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 30px}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);font-size:.76rem;font-weight:600;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
  .chip:hover{color:var(--txt);border-color:#343440}
  .chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1206;border-color:transparent}

  .sect{margin:0 0 34px;scroll-margin-top:86px}
  .sect-head{display:flex;align-items:baseline;gap:9px;margin:0 0 13px;padding-bottom:7px;
    border-bottom:1px solid rgba(255,255,255,.055)}
  .sect-head h2{font-size:.68rem;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .sect-head .n{font-size:.65rem;color:var(--dimmer);font-variant-numeric:tabular-nums}
  .sect-head .ln{flex:1}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:11px}
  .card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
    min-height:96px;padding:14px 15px 12px;border-radius:12px;border:1px solid var(--line);
    background:linear-gradient(160deg,var(--panel2),var(--panel));cursor:pointer;overflow:hidden;
    transition:transform .15s,border-color .15s,box-shadow .15s;text-decoration:none;color:inherit}
  .card:hover{transform:translateY(-2px);border-color:#3a3a48;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .card h3{font-size:.92rem;line-height:1.25;letter-spacing:-.01em;font-weight:650}
  .meta{display:flex;align-items:center;gap:8px;font-size:.66rem;color:var(--dimmer);
    text-transform:uppercase;letter-spacing:.07em}
  .meta .tag{padding:2px 6px;border-radius:4px;background:rgba(255,138,61,.10);color:#d98850;font-weight:700}
  .meta .tag.dl{background:rgba(124,92,255,.13);color:#a99ae8}
  .play{position:absolute;right:13px;top:13px;width:24px;height:24px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.05);opacity:0;transition:.15s}
  .card:hover .play{opacity:1}
  .empty{padding:60px 0;text-align:center;color:var(--dim);display:none}
  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--dimmer);font-size:.74rem;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  #overlay{position:fixed;inset:0;z-index:100;display:none;background:#08080c;flex-direction:column}
  #overlay.open{display:flex}
  .ov-bar{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--panel);border-bottom:1px solid var(--line)}
  .ov-title{font-weight:700;font-size:.86rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov-btn{padding:7px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
    color:var(--txt);font-size:.76rem;font-weight:600;cursor:pointer;text-decoration:none}
  .ov-btn:hover{border-color:var(--acc);color:var(--acc)}
  #frame{flex:1;width:100%;border:0;background:#000}
  body.locked{overflow:hidden}
  @media(max-width:560px){.count{display:none}.hero h1{font-size:1.9rem}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>

const ovNew = document.getElementById('ovNew');

const CHIPS = ['All'].concat(ORDER.filter(g => GAMES.some(x => x.g === g)));
CHIPS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === 0 ? ' on' : '');
  b.textContent = c;
  b.onclick = () => { group = c; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); render(); };
  chips.appendChild(b);
});

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const q = query.trim().toLowerCase();
  sections.innerHTML = '';
  let total = 0;

  ORDER.forEach(g => {
    if (group !== 'All' && group !== g) return;
    const items = GAMES.filter(x => x.g === g && (!q || x.n.toLowerCase().includes(q)));
    if (!items.length) return;
    total += items.length;

    const sec = document.createElement('section');
    sec.className = 'sect';
    sec.innerHTML = `<div class="sect-head"><h2>${escapeHtml(g)}</h2><span class="n">${items.length}</span><span class="ln"></span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(x => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = x.u;
      a.innerHTML = `<div class="play"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
        <h3>${escapeHtml(x.n)}</h3>
        <div class="meta"><span class="tag${x.d ? ' dl' : ''}">${x.d ? 'Download' : escapeHtml(x.g)}</span><span>${x.s} MB</span></div>`;
      if (x.d) { a.target = '_blank'; a.rel = 'noopener'; }
      else { a.onclick = ev => { ev.preventDefault(); openGame(x); }; }
      grid.appendChild(a);
    });

    sec.appendChild(grid);
    sections.appendChild(sec);
  });

  empty.style.display = total ? 'none' : 'block';
  countEl.textContent = total + ' / ' + GAMES.length + ' games';
  document.getElementById('foot').textContent = GAMES.length + ' games Â· ' + ORDER.filter(g => GAMES.some(x => x.g === g)).length + ' groups Â· 17 archives';
}

function openGame(x){
  ovTitle.textContent = x.n;
  ovNew.href = x.u;
  frame.src = x.u;
  overlay.classList.add('open');
  document.body.classList.add('locked');
  history.replaceState(null, '', '#play=' + encodeURIComponent(x.n));
}
function closeGame(){
  overlay.classList.remove('open');
  document.body.classList.remove('locked');
  frame.src = 'about:blank';
  history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('ovClose').onclick = closeGame;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeGame();
  if (e.key === '/' && document.activeElement !== document.getElementById('q')) { e.preventDefault(); document.getElementById('q').focus(); }
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#play=')) closeGame(); });

render();
</script>
</body>
</html>
