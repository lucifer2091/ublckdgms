<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171412">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('backpage:theme'); } catch (e) {}
  if (t === 'light') t = 'day';      // old saved value
  if (t === 'dark') t = 'night';     // old saved value
  var ok = ['night','dusk','abyss','matcha','day','pure'];
  if (ok.indexOf(t) < 0) t = 'night';
  if (t !== 'night') document.documentElement.setAttribute('data-theme', t);
  var sh = null;
  try { sh = localStorage.getItem('backpage:shape'); } catch (e) {}
  if (sh === 'tile' || sh === 'square') document.documentElement.setAttribute('data-shape', sh);
  document.querySelector('meta[name="theme-color"]').setAttribute('content',
    { dusk:'#14121f', abyss:'#081418', matcha:'#e7ead6', day:'#ece2d0', pure:'#fafbfc' }[t] || '#171412');
})();
</script>
<title>Backpage</title>
<meta name="description" content="Backpage: a hand-kept index of browser games, sorted by shelf, playable in the overlay.">
<style>
/* =========================================================
   Backpage - design system
   Themes: night (default), dusk, abyss, matcha, day, pure
   Each game group carries its own accent (--ga), set by JS.
   ========================================================= */

:root{
  color-scheme:dark;

  /* night (default) */
  --paper:#171412;
  --card:#201c19;
  --ink:#eee5d7;
  --muted:#b6a795;
  --faint:#8b7d6d;
  --rule:#3a332c;
  --edge:#52493f;
  --hover:#26211d;
  --press:#2b2621;
  --focus:#5f5347;
  --dot:#4a4137;
  --wash:#3b2a1e;
  --sel:#3e372e;
  --accent:#e07a4f;
  --tile:#16120e;
  --stage:#0f0d0b;

  --serif:Georgia,"Iowan Old Style","Times New Roman",Times,serif;
  --head:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --fast:120ms;
  --ease:cubic-bezier(.2,.65,.3,1);
}

html[data-theme="dusk"]{
  color-scheme:dark;
  --paper:#14121f;
  --card:#1b1829;
  --ink:#e6e2f2;
  --muted:#a8a1c0;
  --faint:#7d7696;
  --rule:#2f2a45;
  --edge:#413a5c;
  --hover:#211d33;
  --press:#262139;
  --focus:#514a70;
  --dot:#3c3656;
  --wash:#2e2445;
  --sel:#352e52;
  --accent:#a78bfa;
  --tile:#171324;
  --stage:#0a0813;
}

html[data-theme="abyss"]{
  color-scheme:dark;
  --paper:#081418;
  --card:#0f222a;
  --ink:#e0ebeb;
  --muted:#9cb4b4;
  --faint:#6c8587;
  --rule:#1c3138;
  --edge:#2d454d;
  --hover:#142a32;
  --press:#172f37;
  --focus:#3d5a63;
  --dot:#274149;
  --wash:#133a33;
  --sel:#153f40;
  --accent:#37c1a8;
  --tile:#0c1c21;
  --stage:#050e12;
}

/* green tea: a tea-stained laid paper, not a cream one. the sheet has a khaki
   cast and the cards laid on it are cooler and cleaner, the way fresh stock
   reads against aged stock. inks are olive-black rather than brown-black, and
   the one strong colour is bitter matcha, so the theme stays quiet. */
html[data-theme="matcha"]{
  color-scheme:light;
  --paper:#dde1c3;
  --card:#eef0dc;
  --ink:#1f2517;
  --muted:#525e44;
  --faint:#6f7860;
  --rule:#c6cda9;
  --edge:#9aa27c;
  --hover:#f5f6e6;
  --press:#d9dcbe;
  --focus:#8f9a71;
  --dot:#b4bc97;
  --wash:#d6dfb8;
  --sel:#ccd6a9;
  --accent:#47621f;
  --tile:#232818;
  --stage:#0c0e08;
}

/* warm light: parchment with a rose-tan undertone, pages brighter and pinker
   than the board they sit on. brown-black ink, terracotta as the single hot
   note; the shelf accents carry the rest of the editorial range. */
html[data-theme="day"]{
  color-scheme:light;
  --paper:#e5d2b5;
  --card:#f4e7d2;
  --ink:#221a14;
  --muted:#645545;
  --faint:#836f58;
  --rule:#d2be9f;
  --edge:#b9a181;
  --hover:#faf1e1;
  --press:#e2d0b6;
  --focus:#a0876d;
  --dot:#c9b596;
  --wash:#ecd6b8;
  --sel:#ddc8a8;
  --accent:#a83a18;
  --tile:#281e13;
  --stage:#14100c;
}

/* pure light: no cast in the stock at all. white paper, neutral greys, one
   ink blue for interaction, and the colour is left to the shelves. the light
   theme you reach for when the tinted ones feel like a mood rather than a
   mode. */
html[data-theme="pure"]{
  color-scheme:light;
  --paper:#fafbfc;
  --card:#ffffff;
  --ink:#111317;
  --muted:#54585f;
  --faint:#7a7f87;
  --rule:#e4e6ea;
  --edge:#c8ccd3;
  --hover:#f3f4f7;
  --press:#e9ebf0;
  --focus:#9ba1aa;
  --dot:#b8bcc4;
  --wash:#eef1f7;
  --sel:#dce6ff;
  --accent:#1f4ed8;
  --tile:#1b1e24;
  --stage:#0b0d11;
}

*{box-sizing:border-box}
html{
  font-size:clamp(87.5%, 1.6vw + 81.7%, 115%);
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  text-align:left;
  max-width:calc(100% - 1.9rem);
  background:
    linear-gradient(180deg, color-mix(in oklab, var(--card) 30%, var(--paper)) 0, var(--paper) 280px),
    var(--paper);
  color:var(--ink);
  font:400 1rem/1.6 var(--serif);
  -webkit-font-smoothing:antialiased;
  animation:settle .18s ease-out both;
}
@keyframes settle{from{opacity:0}to{opacity:1}}

/* each paper ages its own way: the tea sheet stains from the left corner and
   keeps a cleaner patch at the right, the daylight sheet warms across the top.
   a whisper of grain sits on both, fine enough to read as stock rather than
   noise. */
html[data-theme="matcha"] body{
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' filter='url(%23g)' opacity='.55'/></svg>");
  background:
    var(--grain),
    radial-gradient(115% 64% at 6% -16%, color-mix(in oklab, var(--wash) 62%, transparent) 0%, transparent 60%),
    radial-gradient(95% 52% at 102% 6%, color-mix(in oklab, var(--card) 46%, transparent) 0%, transparent 56%),
    linear-gradient(180deg, color-mix(in oklab, var(--card) 36%, var(--paper)) 0, var(--paper) 300px),
    var(--paper);
  background-blend-mode: soft-light, normal, normal, normal, normal;
}
html[data-theme="day"] body{
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='170' height='170' filter='url(%23g)' opacity='.6'/></svg>");
  background:
    var(--grain),
    radial-gradient(100% 58% at 50% -14%, color-mix(in oklab, var(--wash) 66%, transparent) 0%, transparent 58%),
    linear-gradient(180deg, color-mix(in oklab, var(--card) 52%, var(--paper)) 0, var(--paper) 300px),
    var(--paper);
  background-blend-mode: soft-light, normal, normal, normal;
}
/* no grain here: a pure sheet should stay clean. just a whisper of cool
   daylight at the top edge so the white has a direction. */
html[data-theme="pure"] body{
  background:
    radial-gradient(120% 54% at 50% -12%, color-mix(in oklab, var(--wash) 88%, transparent) 0%, transparent 62%),
    linear-gradient(180deg, #ffffff 0, var(--paper) 300px),
    var(--paper);
}

/* the dark rooms get a light source instead of an illustration: a lamp behind
   the masthead at night, a violet horizon at dusk, waterlight rising in the
   abyss. grain keeps them from reading as flat fills. */
html[data-theme="night"] body{
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='.5'/></svg>");
  background:
    var(--grain),
    radial-gradient(120% 70% at 86% -20%, color-mix(in oklab, var(--wash) 52%, transparent) 0%, transparent 62%),
    linear-gradient(180deg, color-mix(in oklab, var(--card) 34%, var(--paper)) 0, var(--paper) 300px),
    var(--paper);
  background-blend-mode: soft-light, normal, normal, normal;
}
html[data-theme="dusk"] body{
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='.5'/></svg>");
  background:
    var(--grain),
    radial-gradient(130% 62% at 50% -18%, color-mix(in oklab, var(--wash) 60%, transparent) 0%, transparent 64%),
    linear-gradient(180deg, color-mix(in oklab, var(--card) 34%, var(--paper)) 0, var(--paper) 300px),
    var(--paper);
  background-blend-mode: soft-light, normal, normal, normal;
}
html[data-theme="abyss"] body{
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='.5'/></svg>");
  background:
    var(--grain),
    radial-gradient(120% 64% at 18% -16%, color-mix(in oklab, var(--wash) 64%, transparent) 0%, transparent 62%),
    linear-gradient(180deg, color-mix(in oklab, var(--card) 30%, var(--paper)) 0, var(--paper) 300px),
    var(--paper);
  background-blend-mode: soft-light, normal, normal, normal;
}

/* section reveal on first view (JS adds .reveal/.in, respects reduced motion) */
.sect.reveal{opacity:0;transform:translateY(12px)}
.sect.reveal.in{
  opacity:1;transform:none;
  transition:opacity .36s var(--ease), transform .36s var(--ease);
}

/* settings panel pop */
.set-panel{transform-origin:top right}
.set-panel:not([hidden]){animation:pop .17s var(--ease)}
@keyframes pop{
  from{opacity:0;transform:scale(.96) translateY(-4px)}
  to{opacity:1;transform:none}
}

/* log panel slide */
.log-panel:not([hidden]){animation:rise .22s var(--ease)}
@keyframes rise{
  from{transform:translateY(14px);opacity:.4}
  to{transform:none;opacity:1}
}

.wrap{
  max-width:clamp(74rem, 78vw, 94rem);
  margin:0 auto;
  padding:0 clamp(16px, 2.4vw, 40px);
}
a{color:inherit}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{
  background:var(--edge);border-radius:99px;
  border:3px solid var(--paper);
}
::-webkit-scrollbar-thumb:hover{background:var(--focus)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ------------------------------------------------ header */

header{
  position:sticky;top:0;z-index:30;
  border-bottom:0;
  background:color-mix(in oklab, var(--paper) 86%, transparent);
  backdrop-filter:blur(12px) saturate(1.1);
  -webkit-backdrop-filter:blur(12px) saturate(1.1);
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  border-top:1px solid var(--edge);
  border-bottom:1px solid color-mix(in oklab, var(--edge) 45%, transparent);
  pointer-events:none;
}
.top{
  display:flex;align-items:baseline;flex-wrap:wrap;
  gap:clamp(10px, .9rem, 20px);
  padding:clamp(12px, 1.1rem, 20px) clamp(16px, 2.4vw, 40px) clamp(11px, 1rem, 18px);
}
.brand{
  display:inline-flex;align-items:baseline;gap:.5rem;
  font-family:var(--head);
  font-size:clamp(1.28rem, 2.5vw, 1.55rem);font-weight:700;letter-spacing:-.01em;
}
.brand::before{
  content:"";width:.44rem;height:.44rem;flex:none;align-self:center;
  transform:rotate(45deg);
  background:var(--accent);
}
.brand i{font-style:normal;color:var(--accent)}
.top .grow{flex:1 1 1rem}
.count{
  padding:0;
  background:none;border:0;
  font-family:var(--serif);font-style:italic;
  font-size:.8rem;color:var(--faint);white-space:nowrap;
  transition:opacity var(--fast) linear;
}

.set{
  position:relative;align-self:center;
}
.set-btn{
  display:inline-flex;align-items:center;gap:.45rem;
  background:none;border:0;border-bottom:1px solid transparent;border-radius:0;
  padding:.26rem .3rem;cursor:pointer;
  font:inherit;font-style:italic;font-size:.8rem;
  color:var(--muted);white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.set-btn::after{
  content:"";width:.42rem;height:.42rem;flex:none;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-.1rem);
  opacity:.55;
  transition:transform var(--fast) var(--ease);
}
.set-btn:hover{color:var(--ink)}
.set-btn:hover::after{opacity:.8}
.set-btn[aria-expanded="true"]{
  color:var(--ink);
  border-bottom:1px solid color-mix(in oklab, var(--accent) 55%, transparent);
}
.set-btn[aria-expanded="true"]::after{transform:rotate(225deg)}
.set-btn .sw{width:.95rem;height:.62rem;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--ink) 22%, transparent)}
/* tile shape in the top bar: three aspect glyphs, so the switch is reachable
   without opening the theme menu. same setting as the labelled row in the
   panel, and both stay in sync. */
.shape{
  display:inline-flex;align-items:center;gap:2px;align-self:center;
  padding:2px;
  border:1px solid var(--rule);
  border-radius:7px;
  background:color-mix(in oklab, var(--card) 45%, transparent);
}
.shape__b{
  display:grid;place-items:center;
  width:1.65rem;height:1.4rem;padding:0;margin:0;
  background:none;border:0;border-radius:5px;
  color:var(--faint);cursor:pointer;
  transition:background-color var(--fast) linear, color var(--fast) linear;
}
.shape__b:hover{background:var(--hover);color:var(--ink)}
.shape__b[aria-checked="true"]{
  background:color-mix(in oklab, var(--accent) 15%, var(--card));
  color:var(--ink);
}
.shape__b:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shape__g{display:block;border:1.4px solid currentColor;border-radius:1.5px;opacity:.8}
.shape__b[aria-checked="true"] .shape__g{opacity:1}
.shape__g--banner{width:1rem;height:.3rem}
.shape__g--tile{width:.78rem;height:.56rem}
.shape__g--square{width:.56rem;height:.56rem}
/* the phone header has no room for a third control, so the labelled row in
   the theme menu carries the switch there */
@media (max-width:560px){
  .shape{display:none}
}

.set-panel{
  position:absolute;top:calc(100% + .55rem);right:0;z-index:44;
  min-width:16.5rem;
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:10px;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.42);
  padding:.45rem;
}
.set-panel[hidden]{display:none}
/* on a phone the menu is wider than the space left of the button, so it drops
   out of the button and hangs across the header's content column instead */
@media (max-width:560px){
  .top{position:relative}
  .set{position:static}
  .set-panel{
    top:calc(100% + .5rem);
    left:clamp(16px, 2.4vw, 40px);
    right:clamp(16px, 2.4vw, 40px);
    width:auto;min-width:0;
  }
}
.set-tit{
  font-style:italic;font-size:.7rem;color:var(--faint);
  padding:.3rem .6rem .35rem;letter-spacing:.05em;
}
.set-opt{
  display:flex;align-items:center;gap:.6rem;
  width:100%;
  background:none;border:0;padding:.5rem .6rem;margin:0;
  border-radius:8px;cursor:pointer;text-align:left;
  font:inherit;color:var(--muted);
  transition:background-color var(--fast) linear, color var(--fast) linear;
}
.set-opt:hover{background:color-mix(in oklab, var(--accent) 8%, var(--hover));color:var(--ink)}
.set-opt[aria-checked="true"]{
  background:color-mix(in oklab, var(--accent) 14%, var(--card));
  color:var(--ink);
}
.set-opt[aria-checked="true"] .set-name{font-weight:600}
.set-opt .sw{width:1.7rem;height:1.05rem;border-radius:5px;flex:none;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--ink) 22%, transparent)}
.set-opt .set-name{font-size:.84rem;white-space:nowrap}
.set-opt .set-desc{margin-left:auto;font-style:italic;font-size:.72rem;color:var(--faint)}
.set-opt[aria-checked="true"]::after{
  content:"";width:.34rem;height:.34rem;flex:none;
  background:var(--accent);border-radius:99px;
  margin-left:.15rem;
}
/* tile shape: three cells on one hairline rail, so the panel stays a list of
   choices instead of growing into a second menu */
.set-tit--shape{
  margin-top:.2rem;
  border-top:1px solid var(--rule);
  padding-top:.55rem;
}
.set-seg{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;
  margin:.05rem .35rem .35rem;
  background:var(--rule);
  border:1px solid var(--rule);
  border-radius:7px;
  overflow:hidden;
}
.set-seg__b{
  background:var(--card);border:0;margin:0;
  padding:.42rem .2rem .44rem;
  font:inherit;font-size:.76rem;line-height:1.2;
  color:var(--muted);cursor:pointer;text-align:center;
  transition:background-color var(--fast) linear, color var(--fast) linear;
}
.set-seg__b:hover{background:var(--hover);color:var(--ink)}
.set-seg__b[aria-checked="true"]{
  background:color-mix(in oklab, var(--accent) 15%, var(--card));
  color:var(--ink);font-weight:600;
}
.set-seg__b:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sw-night{background:linear-gradient(135deg, #4a3322 0%, #171412 62%)}
.sw-dusk{background:linear-gradient(135deg, #7a63c4 0%, #14121f 66%)}
.sw-abyss{background:linear-gradient(135deg, #37c1a8 0%, #081418 68%)}
.sw-matcha{background:linear-gradient(135deg, #3f5a2b 0%, #8d9c68 50%, #dde1c3 100%)}
.sw-day{background:linear-gradient(135deg, #a83a18 0%, #cfa878 56%, #f4e7d2 100%)}
.sw-pure{background:linear-gradient(135deg, #1f4ed8 0%, #c9d0da 44%, #ffffff 100%)}

.search{position:relative}
.search::after{
  content:"";position:absolute;
  left:.62rem;top:50%;width:.78rem;height:.78rem;
  transform:translateY(-50%);
  background:var(--faint);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='6.7'/><path d='M15.6 15.6 21 21'/></svg>") center / 100% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='6.7'/><path d='M15.6 15.6 21 21'/></svg>") center / 100% no-repeat;
  pointer-events:none;
}
.search input{
  width:clamp(130px, 18vw, 220px);
  padding:.32rem .6rem .34rem 1.8rem;
  border:0;border-bottom:1px solid var(--edge);border-radius:0;
  background:none;color:var(--ink);
  font:inherit;font-size:.84rem;outline:none;
  transition:border-color var(--fast) linear;
}
.search input:focus{border-bottom-color:color-mix(in oklab, var(--accent) 70%, var(--edge))}
.search input::placeholder{color:var(--faint)}

/* ------------------------- hero: game of the day + shuffle (2 : 1) */

.hero{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(0,1fr);
  gap:clamp(14px, 1.8vw, 26px);
  align-items:stretch;
  margin:clamp(18px,1.8rem,30px) 0 0;
}

.pick{display:flex;min-width:0}
.pick__link{
  display:grid;
  grid-template-columns:clamp(11rem, 44%, 27rem) minmax(0,1fr) auto;
  align-items:center;
  gap:clamp(13px, 1.4vw, 22px);
  width:100%;
  padding:clamp(10px, 1rem, 16px);
  border:1px solid var(--edge);
  border-radius:6px;
  background:color-mix(in oklab, var(--card) 55%, var(--paper));
  text-decoration:none;
  color:inherit;
  transition:border-color var(--fast) linear, background-color var(--fast) linear;
}
.pick__link:hover{
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 52%, var(--edge));
  background:color-mix(in oklab, var(--card) 78%, var(--paper));
}
.pick__art{
  position:relative;
  width:100%;height:auto;
  aspect-ratio:3/1;
  border-radius:4px;
  overflow:hidden;
  background:var(--tile) center/cover no-repeat;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
  transition:filter 200ms linear;
}
.pick__link:hover .pick__art{filter:brightness(1.06) saturate(1.03)}
.pick__txt{min-width:0;display:flex;flex-direction:column;gap:.22rem}
.pick__kick{
  font-family:var(--head);font-weight:700;
  font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:color-mix(in oklab, var(--ga, var(--accent)) 78%, var(--ink));
}
.pick__name{
  font-family:var(--head);font-weight:700;
  font-size:clamp(1.12rem, 1.9vw, 1.5rem);line-height:1.15;
  color:var(--ink);
  overflow-wrap:break-word;
}
.pick__meta{
  font-family:var(--serif);font-style:italic;
  font-size:.8rem;color:var(--faint);
}
.pick__go{
  font-family:var(--serif);font-style:italic;font-size:.86rem;
  color:var(--muted);white-space:nowrap;
  padding-bottom:.1rem;
  border-bottom:1px solid transparent;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.pick__link:hover .pick__go{
  color:var(--ink);
  border-bottom-color:color-mix(in oklab, var(--ga, var(--accent)) 65%, var(--ink));
}
.pick__link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pick[hidden]{display:none}

/* the shuffle block: half the width of the daily pick */
.shuffle{display:flex;min-width:0}
.shuffle__btn{
  display:flex;flex-direction:column;justify-content:space-between;gap:.14rem;
  width:100%;height:100%;
  padding:clamp(14px, 1.3rem, 22px) clamp(16px, 1.5rem, 24px);
  background:
    linear-gradient(180deg, color-mix(in oklab, var(--accent) 6%, var(--card)), var(--card) 64%);
  border:1px solid var(--edge);
  border-radius:6px;
  cursor:pointer;
  font:inherit;color:var(--muted);text-align:left;
  transition:border-color var(--fast) linear, transform var(--fast) var(--ease), background-color var(--fast) linear;
}
.shuffle__btn:hover{
  border-color:color-mix(in oklab, var(--accent) 58%, var(--edge));
  transform:translateY(-2px);
}
.shuffle__btn:active{transform:translateY(-1px)}
.shuffle__btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shuffle__kick{
  font-family:var(--head);font-weight:700;
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);
}
.shuffle__word{
  display:flex;align-items:baseline;gap:.45rem;
  font-family:var(--head);font-weight:700;
  font-size:clamp(1.45rem, 2.5vw, 2rem);line-height:1.06;
  letter-spacing:-.01em;color:var(--ink);
}
.shuffle__mark{
  font-size:.82em;color:var(--accent);
  transition:transform .38s var(--ease);
}
.shuffle__btn:hover .shuffle__mark{transform:rotate(180deg)}
.shuffle__sub{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;color:var(--faint);
}
.shuffle__btn:disabled{opacity:.45;cursor:default}
.shuffle__btn:disabled:hover{transform:none;border-color:var(--edge)}

@media (max-width:1080px){
  .hero{grid-template-columns:1fr;gap:.9rem}
  .shuffle__btn{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:.3rem .6rem}
  .shuffle__sub{margin-left:auto}
}
@media (max-width:640px){
  .pick__link{grid-template-columns:1fr;gap:.6rem;padding:8px 8px 12px}
  .pick__go{display:none}
  .shuffle__sub{display:none}
}

/* ---------------------------------------- recently played */

.recent{
  display:flex;flex-direction:column;gap:.5rem;
  margin:clamp(16px,1.6rem,28px) 0 clamp(18px,2rem,30px);
}
.recent[hidden]{display:none}
.recent-top{display:flex;align-items:baseline;gap:1rem}
.recent-lab{
  flex:1;
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--head);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;
  font-size:.72rem;color:var(--muted);
  margin:0;
}
.recent-lab::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg, var(--rule), transparent);
}
.recent-list{display:flex;flex-wrap:wrap;align-items:center;margin:0;padding:0;list-style:none;gap:.15rem 1.1rem}
.recent-list a{
  display:inline-flex;align-items:center;gap:.42rem;
  color:var(--muted);text-decoration:none;font-size:.86rem;font-style:italic;
  padding:.06rem 0;
  border-bottom:1px solid transparent;
  transition:border-color var(--fast) linear, color var(--fast) linear;
}
.recent-list a::before{
  content:"";width:.44rem;height:.44rem;flex:none;border-radius:99px;
  background:var(--ga, var(--accent));
}
.recent-list a:hover{
  color:var(--ink);
  border-bottom-color:color-mix(in oklab, var(--ga, var(--accent)) 65%, var(--ink));
}
.recent-list a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* clear sits at the far end of the strip, as quiet as the label */
.recent-clear{
  flex:none;
  margin-left:auto;
  background:none;border:0;border-bottom:1px solid transparent;
  padding:.1rem 0;margin-top:0;margin-bottom:0;
  font:inherit;font-style:italic;font-size:.7rem;letter-spacing:.04em;
  color:var(--muted);cursor:pointer;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.recent-clear:hover{
  color:var(--ink);
  border-bottom-color:color-mix(in oklab, var(--accent) 55%, transparent);
}
.recent-clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ------------------------------------------- shelves index */

.index{
  margin:0 0 clamp(18px, 2rem, 30px);
  padding:clamp(10px, .9rem, 16px) 0 clamp(12px, 1rem, 18px);
  border-top:1px solid var(--edge);
  border-bottom:1px solid var(--rule);
}
.index-lab{
  margin:0 0 .5rem;
  font-family:var(--head);font-weight:700;
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);
}
.filters{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(10.5rem, 1fr));
  gap:0 clamp(14px, 1.4vw, 26px);
  margin:0;padding:0;list-style:none;
}
.filters li{margin:0;min-width:0}
.filters button{
  display:flex;align-items:baseline;gap:.42rem;
  width:100%;
  background:none;border:0;border-radius:0;
  padding:.19rem 0;margin:0;cursor:pointer;text-align:left;
  font:inherit;font-size:.82rem;color:var(--muted);
  border-bottom:1px solid transparent;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.filters button:hover{color:var(--ink)}
.filters button.on{
  color:var(--ink);
  border-bottom-color:color-mix(in oklab, var(--ga, var(--accent)) 76%, var(--ink));
}
.filters .group .dot{
  width:.38rem;height:.38rem;flex:none;align-self:center;
  border-radius:99px;
  background:var(--ga, var(--faint));
}
.filters .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters .lead{
  flex:1;min-width:.6rem;height:1px;
  background:var(--rule);
  transform:translateY(-.12em);
}
.filters button.on .lead{
  background:color-mix(in oklab, var(--ga, var(--accent)) 38%, var(--rule));
}
.filter-count{
  flex:none;
  font-size:.72rem;color:var(--faint);
  font-family:var(--serif);font-style:italic;
  font-variant-numeric:tabular-nums;
}
.filters button.on .filter-count{
  color:color-mix(in oklab, var(--ga, var(--accent)) 72%, var(--ink));
}
.filters button.zero{opacity:.38}
.filters .group .lbl-s{display:none}
@media (max-width:640px){
  .filters{grid-template-columns:repeat(2, minmax(0, 1fr));gap:0 14px}
  .filters button{font-size:.78rem}
  .filters .group .lbl{display:none}
  .filters .group .lbl-s{display:inline}
}
@media (max-width:560px){
  .count{display:none}
}

/* ---------------------------------------------  sections */

.sect{margin:0 0 clamp(24px, 2.3rem, 40px)}
.sect-head{display:flex;align-items:baseline;gap:.55rem;margin:0 0 .75rem}
.sect-head h2{
  margin:0;font-family:var(--head);
  font-size:1.1rem;font-weight:700;letter-spacing:.012em;
  color:var(--ink);
  display:inline-flex;align-items:baseline;gap:.45rem;
  padding-bottom:.3rem;
  border-bottom:2px solid color-mix(in oklab, var(--ga, var(--accent)) 76%, var(--ink));
}
.sect-head .n{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;
  color:color-mix(in oklab, var(--ga, var(--accent)) 78%, var(--ink));
  white-space:nowrap;
}
.sect-head .rule{
  flex:1;height:1px;transform:translateY(-.25rem);margin-left:.55rem;
  background:linear-gradient(90deg,
    color-mix(in oklab, var(--ga, var(--accent)) 40%, transparent),
    var(--rule) 46%,
    transparent);
}

/* -------------------------------------------------- grid */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(clamp(11.5rem, 18vw, 13.75rem), 1fr));
  align-items:stretch;
  gap:clamp(.5rem, .62vw, .75rem);
}
/* a shelf folded down to one or two cards looks lost in a full row, so give
   those cards a little more room instead of a column of empty space */
.grid--few{grid-template-columns:repeat(auto-fill, minmax(clamp(14rem, 24vw, 17rem), 1fr));}
.grid--one{grid-template-columns:minmax(0, 24rem)}
.card{
  position:relative;display:block;
  width:auto;min-width:0;max-width:none;
  aspect-ratio:3/1;
  border-radius:5px;
  background:var(--tile);
  text-decoration:none;
  overflow:hidden;
  isolation:isolate;
  transition:box-shadow 180ms var(--ease), transform 180ms var(--ease);
}
.card:hover{transform:translateY(-2px)}
.card:hover{
  box-shadow:
    0 0 0 1px color-mix(in oklab, var(--ga, var(--accent)) 52%, transparent),
    0 10px 26px -10px color-mix(in oklab, var(--ga, var(--accent)) 42%, transparent),
    0 4px 14px -6px rgba(0,0,0,.45);
}
.card:active{transform:translateY(-1px)}
.card:focus-visible{
  outline:none;border-radius:6px;
  box-shadow:0 0 0 2px color-mix(in oklab, var(--ga, var(--accent)) 86%, var(--ink));
}

/* a series card is a button, not a link: it opens the list, not a game */
.card--series{
  width:100%;margin:0;padding:0;border:0;
  font:inherit;color:inherit;text-align:left;
  background:var(--tile);
  cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.card--series .card__in{
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:.4rem .95rem;box-sizing:border-box;
}
.card--series .card__t{
  position:static;transform:none;left:auto;right:auto;top:auto;
}
/* the count sits right under the name in the shelf accent, so a tile that
   hides five chapters or ten builds says so before you click it */
.card__n{
  position:relative;z-index:2;
  display:inline-flex;align-items:baseline;gap:.26rem;
  margin-top:.22rem;
  padding:.09rem .44rem .12rem;
  border-radius:99px;
  background:var(--ga, var(--accent));
  color:#171412;
  font-family:var(--head);font-weight:700;
  font-size:clamp(.56rem, 3.05cqw, .7rem);
  letter-spacing:.07em;text-transform:uppercase;line-height:1.15;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.38);
  white-space:nowrap;
}
.card__chev{
  font-style:normal;font-weight:700;font-size:1.1em;line-height:1;
  opacity:.85;display:inline-block;
}
html[data-theme="day"] .card__n,
html[data-theme="matcha"] .card__n,
html[data-theme="pure"] .card__n{
  color:#f7f1e6;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.3);
}

.card__in{
  position:relative;display:block;width:100%;height:100%;
  container-type:inline-size;
}

.card__art{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  background-image:var(--art);
  filter:saturate(.96) contrast(1.06) brightness(1);
  transform:scale(1);
  transition:filter 200ms linear, transform 320ms var(--ease);
}
.card:hover .card__art{filter:saturate(1.04) contrast(1.08) brightness(1.07);transform:scale(1.035)}

/* with 700+ cards, only fetch artwork for cards near the viewport. the script
   adds .is-in as they approach; until then the tile ground shows through. */
#sections .card:not(.is-in) .card__art{background-image:none}

/* scrim: darkens the left where the title sits, and the outer edges */
.card::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(8,9,12,.90) 0%, rgba(8,9,12,.84) 34%, rgba(8,9,12,.70) 54%, rgba(8,9,12,.42) 66%, rgba(8,9,12,.08) 80%, rgba(8,9,12,.34) 100%),
    radial-gradient(42% 100% at 94% 50%, rgba(8,9,12,.6) 0%, rgba(8,9,12,.4) 55%, rgba(8,9,12,0) 100%),
    linear-gradient(0deg, rgba(8,9,12,.54) 0%, rgba(8,9,12,0) 44%, rgba(8,9,12,.2) 100%);
  box-shadow:inset 0 0 2.2rem rgba(0,0,0,.5);
}
.card.plate{
  background:
    radial-gradient(120% 130% at 24% 42%, color-mix(in oklab, var(--ga, var(--accent)) 20%, var(--tile)) 0%, var(--tile) 52%, var(--stage) 100%);
}
.card.plate::before{
  background:radial-gradient(130% 150% at 18% 46%, color-mix(in oklab, var(--ga, var(--accent)) 24%, var(--tile)) 0%, color-mix(in oklab, var(--tile) 82%, transparent) 54%, color-mix(in oklab, var(--stage) 92%, transparent) 100%);
}

/* theme-tuned art: same title-zone darkness in every theme, hue and edge
   brightness follow the theme (night warm-dark, dusk cool-dark, day warm-light) */
html[data-theme="dusk"] .card::before{
  background:
    linear-gradient(90deg, rgba(6,5,14,.88) 0%, rgba(6,5,14,.82) 34%, rgba(6,5,14,.68) 54%, rgba(6,5,14,.40) 66%, rgba(6,5,14,.09) 80%, rgba(6,5,14,.34) 100%),
    radial-gradient(42% 100% at 94% 50%, rgba(6,5,14,.58) 0%, rgba(6,5,14,.4) 55%, rgba(6,5,14,0) 100%),
    linear-gradient(0deg, rgba(6,5,14,.54) 0%, rgba(6,5,14,0) 42%, rgba(6,5,14,.2) 100%);
  box-shadow:inset 0 0 2.2rem rgba(2,1,10,.5);
}
html[data-theme="dusk"] .card__art{filter:saturate(.98) contrast(1.07) brightness(1)}
html[data-theme="dusk"] .card:hover .card__art{filter:saturate(1.02) contrast(1.08) brightness(1.04);transform:scale(1.035)}


html[data-theme="abyss"] .card::before{
  background:
    linear-gradient(90deg, rgba(5,19,24,.90) 0%, rgba(5,19,24,.84) 34%, rgba(5,19,24,.70) 54%, rgba(5,19,24,.42) 66%, rgba(5,19,24,.09) 80%, rgba(5,19,24,.34) 100%),
    radial-gradient(42% 100% at 94% 50%, rgba(5,19,24,.58) 0%, rgba(5,19,24,.4) 55%, rgba(5,19,24,0) 100%),
    linear-gradient(0deg, rgba(5,19,24,.54) 0%, rgba(5,19,24,0) 42%, rgba(5,19,24,.2) 100%);
  box-shadow:inset 0 0 2.2rem rgba(2,8,12,.54);
}
html[data-theme="abyss"] .card__art{filter:saturate(.98) contrast(1.07) brightness(1)}
html[data-theme="abyss"] .card:hover .card__art{filter:saturate(1.02) contrast(1.08) brightness(1.04);transform:scale(1.035)}


html[data-theme="matcha"] .card::before,
html[data-theme="day"] .card::before,
html[data-theme="pure"] .card::before{
  background:none;
  box-shadow:none;
}
/* a light theme cannot be a wall of dark banners, and the two light themes
   cannot be one mounting system in two hues. green tea mounts a specimen
   flat on the sheet: tone-on-tone mat, hairline keyline, no shadow. warm
   light mounts a print: cream board, bevelled edge, shadow underneath. */
html[data-theme="matcha"] .card{
  padding:clamp(4px, .42vw, 6px);
  background:color-mix(in oklab, var(--paper) 58%, var(--card));
  border:1px solid var(--rule);
  border-radius:4px;
  box-shadow:none;
}
html[data-theme="matcha"] .card:hover{
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 56%, var(--rule));
  box-shadow:0 10px 22px -18px color-mix(in oklab, var(--ga, var(--accent)) 60%, #3a3a26);
}
html[data-theme="matcha"] .card:focus-visible{
  box-shadow:0 0 0 2px color-mix(in oklab, var(--ga, var(--accent)) 86%, var(--ink));
}
/* the four art-less plates keep their dark stage inside the mount, so their
   cream titles still have something to sit on */
html[data-theme="matcha"] .card.plate .card__in,
html[data-theme="day"] .card.plate .card__in,
html[data-theme="pure"] .card.plate .card__in{
  background:
    radial-gradient(120% 130% at 24% 42%, color-mix(in oklab, var(--ga, var(--accent)) 20%, var(--tile)) 0%, var(--tile) 52%, var(--stage) 100%);
}
html[data-theme="matcha"] .card.plate .card__in{border-radius:2px}
html[data-theme="day"] .card.plate .card__in,
html[data-theme="pure"] .card.plate .card__in{border-radius:3px}
html[data-theme="matcha"] .card__art{border-radius:2px}
html[data-theme="day"] .card__art,
html[data-theme="pure"] .card__art{border-radius:3px}
html[data-theme="matcha"] .card__t{
  color:#f7f1e6;
  -webkit-text-stroke:.032em rgba(0,0,0,.82);
  paint-order:stroke fill;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.48);
}
html[data-theme="matcha"] .card.plate .card__t{
  color:#f1ebdf;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.55);
}
html[data-theme="matcha"] .card__art{filter:saturate(.96) contrast(1.04) brightness(1.02)}
html[data-theme="matcha"] .card:hover .card__art{filter:saturate(1.02) contrast(1.06) brightness(1.06);transform:scale(1.03)}


html[data-theme="day"] .card{
  padding:clamp(5px, .55vw, 8px);
  background:var(--card);
  border:1px solid color-mix(in oklab, var(--edge) 40%, var(--card));
  box-shadow:
    0 1px 1px rgba(58,40,22,.16),
    0 14px 26px -20px rgba(58,40,22,.58);
}
html[data-theme="day"] .card:hover{
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 46%, var(--card));
  box-shadow:
    0 0 0 1px color-mix(in oklab, var(--ga, var(--accent)) 46%, transparent),
    0 16px 30px -18px color-mix(in oklab, var(--ga, var(--accent)) 40%, rgba(58,40,22,.58)),
    0 2px 4px rgba(58,40,22,.2);
}
html[data-theme="day"] .card:focus-visible{
  box-shadow:0 0 0 2px color-mix(in oklab, var(--ga, var(--accent)) 86%, var(--ink));
}
html[data-theme="day"] .card__t{
  color:#f7f1e6;
  -webkit-text-stroke:.032em rgba(0,0,0,.82);
  paint-order:stroke fill;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.48);
}
html[data-theme="day"] .card.plate .card__t{
  color:#f1ebdf;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.55);
}
html[data-theme="day"] .card__art{filter:sepia(.07) saturate(1.08) contrast(1.02) brightness(1.07)}
html[data-theme="day"] .card:hover .card__art{filter:sepia(.05) saturate(1.16) contrast(1.04) brightness(1.13);transform:scale(1.035)}


/* pure light mounts a contact sheet: white board on white paper, one hairline
   and a shadow so thin it reads as a lift rather than a frame. the size tag is
   white too, so the only dark things on the page are the banners themselves. */
html[data-theme="pure"] .card{
  padding:clamp(4px, .45vw, 7px);
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:4px;
  box-shadow:
    0 1px 2px rgba(17,19,23,.06),
    0 12px 22px -20px rgba(17,19,23,.55);
}
html[data-theme="pure"] .card:hover{
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 44%, var(--rule));
  box-shadow:
    0 0 0 1px color-mix(in oklab, var(--ga, var(--accent)) 40%, transparent),
    0 14px 26px -18px rgba(17,19,23,.5);
}
html[data-theme="pure"] .card:focus-visible{
  box-shadow:0 0 0 2px var(--accent);
}
html[data-theme="pure"] .card__t{
  color:#f7f1e6;
  -webkit-text-stroke:.032em rgba(0,0,0,.82);
  paint-order:stroke fill;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.48);
}
html[data-theme="pure"] .card.plate .card__t{
  color:#f1ebdf;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.55);
}
html[data-theme="pure"] .card__art{filter:saturate(1.06) contrast(1.03) brightness(1.02)}
html[data-theme="pure"] .card:hover .card__art{filter:saturate(1.12) contrast(1.05) brightness(1.07);transform:scale(1.035)}

/* the furniture follows the same split: green tea's panels are the sheet with
   a hairline, warm light's are cream plates laid on the board */
html[data-theme="matcha"] .pick__link{
  background:color-mix(in oklab, var(--paper) 74%, var(--card));
  border-color:var(--rule);
}
html[data-theme="matcha"] .pick__link:hover{
  background:color-mix(in oklab, var(--paper) 52%, var(--card));
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 46%, var(--rule));
}
html[data-theme="matcha"] .shuffle__btn{
  background:color-mix(in oklab, var(--paper) 74%, var(--card));
  border-color:var(--rule);
}
html[data-theme="matcha"] .shuffle__btn:hover{
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 46%, var(--rule));
}
html[data-theme="day"] .pick__link{
  background:var(--card);
  border-color:color-mix(in oklab, var(--edge) 72%, var(--card));
}
html[data-theme="day"] .shuffle__btn{
  border-color:color-mix(in oklab, var(--edge) 72%, var(--card));
}
html[data-theme="pure"] .pick__link{
  background:var(--card);
  border-color:var(--rule);
}
html[data-theme="pure"] .pick__link:hover{
  background:var(--card);
  border-color:color-mix(in oklab, var(--accent) 40%, var(--rule));
}
html[data-theme="pure"] .shuffle__btn{
  background:linear-gradient(180deg, color-mix(in oklab, var(--accent) 4%, var(--card)), var(--card) 64%);
  border-color:var(--rule);
}
html[data-theme="pure"] .shuffle__btn:hover{
  border-color:color-mix(in oklab, var(--accent) 44%, var(--rule));
}
html[data-theme="pure"] .set-panel{
  box-shadow:0 12px 30px -14px rgba(17,19,23,.3);
}


/* on phones the banners run full width, like the reference */
@media (max-width:560px){
  .grid{grid-template-columns:1fr;gap:.6rem}
  .card{min-height:0;max-height:none}
}

/* --------------------------------------------- tile shapes

   banner is the default, and the only shape that shows the artwork whole,
   because the banners are 3:1. tile and square crop to the middle-right of
   the banner, where the screenshot sits, and move the title to the foot of
   the picture over a bottom scrim, so a tile reads as a picture instead of a
   strip. */

html[data-shape="tile"] .grid{
  grid-template-columns:repeat(auto-fill, minmax(clamp(10rem, 15vw, 12.5rem), 1fr));
}
html[data-shape="tile"] .grid--few{
  grid-template-columns:repeat(auto-fill, minmax(clamp(12rem, 19vw, 15rem), 1fr));
}
html[data-shape="tile"] .grid--one{grid-template-columns:minmax(0, 15rem)}

html[data-shape="square"] .grid{
  grid-template-columns:repeat(auto-fill, minmax(clamp(8.5rem, 12vw, 10.5rem), 1fr));
}
html[data-shape="square"] .grid--few{
  grid-template-columns:repeat(auto-fill, minmax(clamp(10rem, 15vw, 12rem), 1fr));
}
html[data-shape="square"] .grid--one{grid-template-columns:minmax(0, 12rem)}

html[data-shape="tile"] .card{aspect-ratio:4/3}
html[data-shape="square"] .card{aspect-ratio:1}

/* picture shapes have their own files, cut from the banner once (see
   make-shapes.ps1), so the grid never slices a 3:1 banner or scales a 1200px
   image down to a 200px tile */
html[data-shape="tile"] .card__art{background-image:var(--art-t, var(--art))}
html[data-shape="square"] .card__art{background-image:var(--art-s, var(--art))}

html[data-shape="tile"] .card::before,
html[data-shape="square"] .card::before{
  background:
    linear-gradient(0deg, rgba(8,9,12,.9) 0%, rgba(8,9,12,.74) 24%, rgba(8,9,12,.3) 48%, rgba(8,9,12,0) 68%),
    linear-gradient(180deg, rgba(8,9,12,.38) 0%, rgba(8,9,12,0) 32%);
  box-shadow:none;
}
html[data-shape="tile"] .card:not(.card--series) .card__t,
html[data-shape="square"] .card:not(.card--series) .card__t{
  top:auto;bottom:.58rem;left:.72rem;right:.72rem;transform:none;
  font-size:clamp(.76rem, 6.2cqw, 1.12rem);
  line-height:1.12;
}
/* a folded series keeps its label centred, with a veil so the name and the
   count chip hold on a bright crop */
html[data-shape="tile"] .card--series::before,
html[data-shape="square"] .card--series::before{
  background:linear-gradient(180deg, rgba(8,9,12,.3), rgba(8,9,12,.6));
}
/* on phones, picture tiles pair up instead of running one per row */
@media (max-width:560px){
  html[data-shape="tile"] .grid,
  html[data-shape="square"] .grid{grid-template-columns:repeat(2,1fr)}
  html[data-shape="tile"] .grid--one,
  html[data-shape="square"] .grid--one{grid-template-columns:1fr}
}

/* frame: 9-slice so corners stay crisp at any width */
.card__f{
  position:absolute;z-index:3;pointer-events:none;
  inset:clamp(3px, 1.9cqw, 9px);
  border:12px solid transparent;
  border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23eae3d4' stroke-width='1.45' stroke-linecap='round'><path d='M6.2 .5H41.8A5.7 5.7 0 0 1 47.5 6.2V41.8A5.7 5.7 0 0 1 41.8 47.5H6.2A5.7 5.7 0 0 1 .5 41.8V6.2A5.7 5.7 0 0 1 6.2 .5Z'/><path stroke-width='.95' d='M6.2 3.5H41.8A2.7 2.7 0 0 1 44.5 6.2V41.8A2.7 2.7 0 0 1 41.8 44.5H6.2A2.7 2.7 0 0 1 3.5 41.8V6.2A2.7 2.7 0 0 1 6.2 3.5Z' opacity='.22'/></svg>") 16 fill / 1 / 0 stretch;
  opacity:.82;
  transition:opacity 160ms linear;
}
.card:hover .card__f{opacity:1}
/* light themes: dark keyline plus a cream inner hairline, so the frame holds
   its edge on bright artwork instead of dissolving into it */
html[data-theme="day"] .card__f,
html[data-theme="matcha"] .card__f,
html[data-theme="pure"] .card__f{
  border-image-source:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23231d16' stroke-width='1.45' stroke-linecap='round'><path d='M6.2 .5H41.8A5.7 5.7 0 0 1 47.5 6.2V41.8A5.7 5.7 0 0 1 41.8 47.5H6.2A5.7 5.7 0 0 1 .5 41.8V6.2A5.7 5.7 0 0 1 6.2 .5Z'/><path stroke='%23f7f1e6' stroke-width='.95' d='M6.2 3.5H41.8A2.7 2.7 0 0 1 44.5 6.2V41.8A2.7 2.7 0 0 1 41.8 44.5H6.2A2.7 2.7 0 0 1 3.5 41.8V6.2A2.7 2.7 0 0 1 6.2 3.5Z' opacity='.45'/></svg>") 16 fill / 1 / 0 stretch;
}
html[data-theme="day"] .card__f::before,
html[data-theme="day"] .card__f::after,
html[data-theme="matcha"] .card__f::before,
html[data-theme="matcha"] .card__f::after{background:rgba(35,29,22,.62)}
/* the pure theme has no warm cast anywhere, so the keyline drops its brown
   and the two jewels go with it */
html[data-theme="pure"] .card__f{filter:grayscale(1)}
html[data-theme="pure"] .card__f::before,
html[data-theme="pure"] .card__f::after{background:rgba(20,22,26,.6)}

/* small jewels straddling the frame at top and bottom centre */
.card__f::before,.card__f::after{
  content:"";position:absolute;left:50%;
  width:.3rem;height:.3rem;
  background:rgba(234,227,212,.8);
  transform:translateX(-50%) rotate(45deg);
  transition:background-color 160ms linear;
}
.card__f::before{top:-.24rem}
.card__f::after{bottom:-.24rem}
.card:hover .card__f::before,
.card:hover .card__f::after{
  background:color-mix(in oklab, var(--ga, var(--accent)) 85%, var(--ink));
}

.card__t{
  position:absolute;z-index:2;
  left:.95rem;right:.95rem;top:50%;
  transform:translateY(-50%);
  margin:0;
  font-family:var(--head);
  font-size:clamp(.88rem, 5.4cqw, 1.5rem);
  font-weight:500;line-height:1.14;letter-spacing:.008em;
  color:#f1ebdf;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.55);
  overflow-wrap:break-word;
  text-wrap:pretty;
}
.nw{white-space:nowrap}

/* one dot marks a heavy download. the number it replaces was the same on
   every card, so it is gone; only the few that run past 400 mb keep a mark. */
.bigdot{
  display:inline-block;
  width:.46rem;height:.46rem;
  border-radius:99px;
  background:rgba(241,235,223,.92);
  box-shadow:0 0 0 1px rgba(10,8,6,.5), 0 1px 4px rgba(0,0,0,.4);
}
.card .bigdot{
  position:absolute;z-index:2;
  right:.72rem;top:.7rem;
  transition:transform 150ms var(--ease), background-color 150ms linear;
}
.card:hover .bigdot{
  background:#fff;
  transform:scale(1.28);
}

.card__mark{
  position:absolute;z-index:0;
  right:.3rem;bottom:-.28em;
  font-family:var(--head);font-weight:700;
  font-size:clamp(3.6rem, 26cqw, 7rem);
  line-height:.8;
  color:rgba(232,225,210,.11);
  letter-spacing:-.02em;
  user-select:none;
}
.card.plate .card__mark{z-index:2;color:rgba(232,225,210,.10)}

.card.dl .card__t::after{
  content:"\2193";color:color-mix(in oklab, var(--accent) 62%, #fff);margin-left:.28rem;font-size:.8em;
  display:inline-block;vertical-align:middle;
  transition:transform var(--fast) var(--ease);
}
.card.dl:hover .card__t::after{transform:translateY(.12em)}

.empty{
  padding:3rem 0 4rem;color:var(--faint);display:none;
  font-family:var(--head);font-style:italic;
  font-size:1.05rem;text-align:center;
}

main.wrap{padding-bottom:clamp(26px, 2.8rem, 52px)}

/* ------------------------------------------------- colophon */

.foot{
  margin-top:clamp(6px, .8rem, 14px);
  padding-bottom:clamp(30px, 3.6rem, 68px);
}
.foot-rule{
  height:5px;
  border-top:1px solid var(--edge);
  border-bottom:1px solid color-mix(in oklab, var(--edge) 45%, transparent);
  margin-bottom:.9rem;
}
.foot-in{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1.2rem;
}
.foot-brand{
  font-family:var(--head);font-weight:700;font-size:.86rem;
}
.foot-brand i{font-style:normal;color:var(--accent)}
.foot-ver{
  margin-left:auto;
  font-family:var(--serif);font-style:italic;
  font-size:.72rem;color:var(--faint);
  font-variant-numeric:tabular-nums;
}

/* ------------------------------------------- game overlay */

#overlay{
  position:fixed;inset:0;height:100dvh;z-index:50;
  display:flex;flex-direction:column;background:var(--stage);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .16s ease-out, visibility 0s linear .16s;
}
#overlay.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .16s ease-out;
}
.ov-bar{
  display:flex;align-items:center;gap:.55rem;
  padding:.55rem .8rem;
  border-bottom:1px solid var(--edge);
  background:color-mix(in oklab, var(--card) 45%, var(--stage));
  color:var(--ink);
  font-size:.8rem;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transform:translateY(-.45rem);
  transition:transform .16s var(--ease);
  box-shadow:none;
}
#overlay.open .ov-bar{transform:none}
.ov-title{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:.55rem;
  font-family:var(--head);font-size:.97rem;
  margin-right:.4rem;
}
.ov-title #ovName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-note{
  flex:none;font-family:var(--serif);font-style:italic;
  font-size:.74rem;color:var(--faint);
  display:inline-flex;align-items:center;gap:.32rem;
}
.ov-note::before{
  content:"";width:.5em;height:.5em;border-radius:99px;
  background:var(--accent);
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ov-note[hidden]{display:none}
.ov-bar a,.ov-bar button{
  background:none;
  border:0;border-bottom:1px solid transparent;border-radius:0;
  padding:.22rem .04rem;cursor:pointer;font:inherit;font-size:.78rem;
  color:var(--muted);text-decoration:none;white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.ov-bar a:hover,.ov-bar button:hover{
  color:var(--ink);
  border-bottom-color:color-mix(in oklab, var(--edge) 70%, transparent);
}
.ov-bar button.done{
  color:var(--accent);
  border-bottom-color:color-mix(in oklab, var(--accent) 60%, transparent);
}
#frame{
  flex:1;width:100%;border:0;background:#000;
  opacity:0;transition:opacity .2s ease-out;
}
#frame.ready{opacity:1}
body.locked{overflow:hidden}

/* ------------------------------------------------ responsive */

@media (max-width:719px){
  .ov-bar{gap:.45rem;font-size:.72rem;flex-wrap:wrap}
  .ov-title{flex:1 1 100%;order:-1}
  .ov-bar a,.ov-bar button{padding:.2rem .6rem}
  #ovFull{display:none}
}
@media (max-width:560px){
  .top .grow{display:none}
  .count{display:none}
  .search{flex:1 1 55%;order:3}
  .search input{width:100%}
  .set{order:2}
  .log-btn{order:4;margin:0}
  .ov-bar a,.ov-bar button{padding:.2rem .55rem;font-size:.7rem}
}

html.theming body,html.theming body *{
  transition:background-color .22s linear,border-color .22s linear,color .22s linear !important;
}
html.theming #overlay,html.theming #overlay *{transition:none !important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* ------------------------------------------------ change log */

.log-btn{
  position:relative;
  background:none;border:0;border-bottom:1px solid transparent;border-radius:0;
  padding:.2rem .3rem;margin:0;cursor:pointer;
  font:inherit;font-style:italic;font-size:.8rem;
  color:var(--muted);white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.log-btn:hover{color:var(--ink)}
.log-btn[aria-expanded="true"]{
  color:var(--ink);
  border-bottom:1px solid color-mix(in oklab, var(--accent) 55%, transparent);
}
.log-btn[hidden]{display:none}

.log-scrim{
  position:fixed;inset:0;z-index:39;
  background:color-mix(in oklab, var(--ink) 26%, transparent);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  opacity:0;transition:opacity .18s linear;
}
.log-scrim[hidden]{display:none}
.log-scrim.on{opacity:1}

.log-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-height:min(62vh, 33rem);overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--card);
  border-top:2px solid color-mix(in oklab, var(--accent) 55%, transparent);
  border-radius:14px 14px 0 0;
  box-shadow:0 -12px 36px rgba(0,0,0,.30), inset 0 1px 0 color-mix(in oklab, var(--ink) 7%, transparent);
  padding:0 clamp(16px, 2.4vw, 40px) max(1.25rem, env(safe-area-inset-bottom));
}
.log-panel[hidden]{display:none}
.log-panel__in{max-width:52rem;margin:0 auto}
.log-handle{
  width:2.4rem;height:.24rem;margin:.6rem auto .85rem;
  border-radius:99px;
  background:color-mix(in oklab, var(--accent) 55%, var(--edge));
  opacity:.8;
}
.log-head{
  display:flex;align-items:baseline;gap:.55rem;
  padding:0 0 .62rem;
}
.log-head h3{
  margin:0;font-family:var(--head);
  font-size:1rem;font-weight:700;letter-spacing:.005em;
}
.log-head .n{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;color:var(--faint);
}
.log-head button{
  margin-left:auto;
  background:none;border:1px solid transparent;border-radius:0;
  padding:.14rem .3rem;cursor:pointer;
  font:inherit;font-style:italic;font-size:.76rem;
  color:var(--faint);white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.log-head button:hover{color:var(--ink)}

.log-list{margin:0;padding:0;list-style:none}
/* one block per day: the date holds the left column, its notes stack beside it */
.log-day{
  display:grid;grid-template-columns:7.4rem 1fr;gap:.9rem;
  align-items:start;
  padding:.7rem 0;
  border-top:1px solid var(--rule);
}
.log-list>.log-day:first-child{border-top:0}
/* date and version share the left column: the date is the quiet line, the
   version is what the day shipped */
.log-when{
  position:relative;
  display:flex;flex-direction:column;gap:.16rem;
  padding-left:.85rem;
}
.log-when::before{
  content:"";position:absolute;left:0;top:.5em;
  width:.32rem;height:.32rem;border-radius:99px;
  background:var(--edge);
}
.log-list>.log-day:first-child .log-when::before{background:var(--accent)}
.log-when time{
  font-family:var(--serif);font-style:italic;
  font-size:.72rem;color:var(--faint);
  white-space:nowrap;
}
.log-ver{
  display:flex;align-items:baseline;gap:.34rem;
  font-family:var(--head);font-weight:700;
  font-size:.82rem;letter-spacing:.008em;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  white-space:nowrap;
}
.log-list>.log-day:first-child .log-ver{color:var(--ink)}
.log-ver .beta{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:.63rem;letter-spacing:.03em;
  color:var(--faint);
  border:1px solid var(--rule);border-radius:99px;
  padding:.01rem .3rem;
  transform:translateY(-.05em);
}
.log-notes{margin:0;padding:0;list-style:none}
.log-notes li{
  position:relative;
  padding-left:.85rem;
  font-size:.86rem;color:var(--muted);line-height:1.5;
}
.log-notes li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:.22rem;height:.22rem;border-radius:99px;
  background:var(--rule);
}
.log-notes li+li{margin-top:.5rem}
.log-list>.log-day:first-child .log-notes li:first-child{color:var(--ink)}
.log-notes span{min-width:0;overflow-wrap:break-word}

@media (max-width:560px){
  .log-day{grid-template-columns:1fr;gap:.3rem;padding:.6rem 0}
  .log-when{flex-direction:row;align-items:baseline;gap:.55rem}
  .log-notes li{font-size:.84rem}
}

/* --------------------------------------------- series chooser */

.choose-scrim{
  position:fixed;inset:0;z-index:41;
  background:color-mix(in oklab, var(--ink) 34%, transparent);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  opacity:0;transition:opacity .18s linear;
}
.choose-scrim[hidden]{display:none}
.choose-scrim.on{opacity:1}

.choose{
  position:fixed;z-index:42;
  left:50%;top:50%;
  width:min(34rem, calc(100vw - 2.4rem));
  max-height:min(78dvh, 40rem);
  display:flex;flex-direction:column;
  background:var(--card);
  border:1px solid color-mix(in oklab, var(--accent) 30%, var(--edge));
  border-radius:12px;
  box-shadow:
    0 26px 64px -22px rgba(0,0,0,.62),
    0 2px 10px rgba(0,0,0,.18),
    inset 0 1px 0 color-mix(in oklab, var(--ink) 8%, transparent);
  opacity:0;visibility:hidden;
  transform:translate(-50%,-50%) scale(.985);
  transition:opacity .16s linear, transform .18s var(--ease);
}
.choose[hidden]{display:none}
.choose.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}

.choose__in{display:flex;flex-direction:column;min-height:0}
.choose__head{
  display:flex;align-items:baseline;gap:.55rem;
  padding:.9rem 1rem .72rem;
  border-bottom:1px solid var(--rule);
}
.choose__head h3{
  margin:0;font-family:var(--head);
  font-size:1rem;font-weight:700;letter-spacing:.005em;
  min-width:0;overflow-wrap:break-word;
}
.choose__meta{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;color:var(--faint);white-space:nowrap;
}
.choose__head button{
  margin-left:auto;
  background:none;border:1px solid transparent;border-radius:0;
  padding:.14rem .3rem;cursor:pointer;
  font:inherit;font-style:italic;font-size:.76rem;
  color:var(--faint);white-space:nowrap;
  transition:color var(--fast) linear;
}
.choose__head button:hover{color:var(--ink)}
.choose__head button:focus-visible{
  outline:none;color:var(--ink);
  box-shadow:0 0 0 1px color-mix(in oklab, var(--accent) 60%, transparent);
}

.choose__list{
  margin:0;padding:.4rem .5rem .6rem;list-style:none;
  overflow-y:auto;overscroll-behavior:contain;
}
.choose__list li + li{border-top:1px solid color-mix(in oklab, var(--rule) 70%, transparent)}
.choose__row{
  display:grid;grid-template-columns:2rem minmax(0,1fr) auto;
  align-items:baseline;gap:.7rem;
  padding:.55rem .6rem;
  border-radius:6px;
  text-decoration:none;color:var(--ink);
  transition:background-color var(--fast) linear;
}
.choose__row:hover{background:color-mix(in oklab, var(--ga, var(--accent)) 13%, var(--card))}
.choose__row:focus-visible{
  outline:none;
  background:color-mix(in oklab, var(--ga, var(--accent)) 16%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--ga, var(--accent)) 62%, transparent);
}
.choose__i{
  font-family:var(--serif);font-style:italic;
  font-size:.72rem;text-align:right;
  color:color-mix(in oklab, var(--ga, var(--accent)) 62%, var(--faint));
  font-variant-numeric:tabular-nums;
}
.choose__n{
  font-family:var(--head);font-size:.88rem;line-height:1.32;
  overflow-wrap:break-word;
}
.choose__s{
  display:flex;align-items:center;justify-content:flex-end;
  min-width:.5rem;
}
/* in the list the dot takes the row's own colour, so a heavy game is marked
   in the same ink as its shelf rather than in the cream used on artwork */
.choose__s .bigdot{
  width:.42rem;height:.42rem;
  background:color-mix(in oklab, var(--ga, var(--accent)) 72%, var(--muted));

let revealIO = null;
let firstReveal = true;
if (!REDUCED && 'IntersectionObserver' in window) {
  revealIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        revealIO.unobserve(en.target);
      }
    });
  }, { rootMargin: '0px 0px -7% 0px', threshold: .04 });
}

// artwork is fetched when a card gets close to the viewport. without this the
// first paint of a 744-game shelf pulls every banner at once.
let artIO = null;
if ('IntersectionObserver' in window) {
  artIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('is-in');
        artIO.unobserve(en.target);
      }
    });
  }, { rootMargin: '700px 0px' });
}

// the observer only reports on the next frame, which left a freshly filtered
// shelf showing bare tiles until something forced a repaint. anything already
// near the viewport is switched on here, and the observer keeps the rest.
function primeArt() {
  const vh = window.innerHeight || 0;
  const cards = document.querySelectorAll('#sections .card:not(.is-in)');
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    if (!artIO) { c.classList.add('is-in'); continue; }
    const r = c.getBoundingClientRect();
    if (r.top < vh + 700 && r.bottom > -700) c.classList.add('is-in');
    else artIO.observe(c);
  }
}

// the artwork of every game in the catalogue is fetched here, behind the lift,
// so a deep scroll lands on warm tiles instead of bare ones and the shelf does
// not have to wait on a card-by-card observer to decide who is near first.
let preloading = false;
let preHideTimer = null;

function hidePreload() {
  const el = $('preloader');
  if (!el) return;
  el.classList.add('done');
  clearTimeout(preHideTimer);
  preHideTimer = setTimeout(function() { el.setAttribute('hidden', ''); }, 600);
}

function startPreload() {
  const el = $('preloader');
  if (!el) return;
  el.classList.remove('done');
  el.removeAttribute('hidden');

  if (preloading) return;
  preloading = true;

  const keys = [];
  const seen = new Set();
  GAMES.forEach(function(x) {
    if (x.i && !seen.has(x.i)) { seen.add(x.i); keys.push(x.i); }
  });

  if (!keys.length) { hidePreload(); return; }

  let left = keys.length;
  keys.forEach(function(k) {
    const img = new Image();
    img.onload = function() { if (--left <= 0) hidePreload(); };
    img.onerror = function() { if (--left <= 0) hidePreload(); };
    img.src = 'images/cards/' + k + '.jpg';
  });
}

// the observer is the fast path, not the only one. a scroll can land a card on
// screen before its callback runs, and a restored scroll position can skip the
// first frame entirely, so anything already near the viewport is switched on
// here as well. this is what keeps a fast flick through the shelf from leaving
// a screen of bare tiles behind.
let artSoon = 0;
function primeArtSoon() {
  if (artSoon) return;
  artSoon = setTimeout(function() {
    artSoon = 0;
    primeArt();
  }, 80);
}
window.addEventListener('scroll', primeArtSoon, { passive: true });
window.addEventListener('resize', primeArtSoon);
window.addEventListener('load', function() {
  primeArt();
  startPreload();
  setTimeout(primeArt, 260);
});

};

// fold a shelf's games into cards, keeping the order they were listed in.
// entries are {game:x} for a lone game or {key, games:[...]} for a series.
function collapse(items) {
  const out = [];
  const seen = {};
  items.forEach(x => {
    if (!x.x) { out.push({ game: x }); return; }
    if (seen[x.x]) { seen[x.x].games.push(x); return; }
    const entry = { key: x.x, games: [x] };
    seen[x.x] = entry;
    out.push(entry);
  });
  // a series narrowed to a single match reads better as that game's own card
  return out.map(e => {
    if (!e.games || e.games.length === 1) return e.games ? { game: e.games[0] } : e;
    e.games.sort((a, b) => (a.o || 99) - (b.o || 99) || a.n.localeCompare(b.n));
    return e;
  });
}

// the log reads by day, not by entry: every note from one date sits under that
// date, and the days run newest first whatever order the array happens to be
// in. dates are written "12 nov 2026", so they are parsed rather than trusted
// to Date.parse, which is not obliged to understand a day-first short month.
const MONTH_NUM = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };

function dayStamp(s) {
  const m = /^(\d{1,2})\s+([a-z]{3})[a-z]*\s+(\d{4})$/i.exec(String(s).trim());
  if (!m) return 0;
  return Date.UTC(+m[3], MONTH_NUM[m[2].toLowerCase()], +m[1]);
}

// one version per release day. the 0.x run is the beta: the page changed shape
// every few days while the catalogue was still being put together. 12 nov 2026
// is 1.0.0, the first release that is not a beta.
const RELEASES = {
  '2026-10-27': '0.0.1',
  '2026-10-29': '0.0.2',
  '2026-10-30': '0.0.3',
  '2026-11-05': '0.1.0',

};

const LATEST = Object.keys(RELEASES).reduce(function(best, k) {
  return k > best ? k : best;
}, '');
const LATEST_VER = RELEASES[LATEST] || '';
if ($('footVer')) $('footVer').textContent = LATEST_VER ? 'v' + LATEST_VER : '';

function renderLog() {
  const list = $('logList');
  list.innerHTML = '';

  const days = [];
  const byDay = {};
  CHANGES.forEach(function(c) {
    const k = dayStamp(c.d);
    if (!byDay[k]) {
      byDay[k] = { label: c.d, notes: [] };
      days.push(k);
    }
    byDay[k].notes.push(c.t);
  });
  days.sort(function(a, b) { return b - a; });

  days.forEach(function(k) {
    const day = byDay[k];
    const iso = new Date(k).toISOString().slice(0, 10);
    const ver = RELEASES[iso] || '';

    const li = document.createElement('li');
    li.className = 'log-day';

    const when = document.createElement('div');
    when.className = 'log-when';

    const time = document.createElement('time');
    time.textContent = day.label;
    time.dateTime = iso;
    when.appendChild(time);

    if (ver) {
      const badge = document.createElement('span');
      badge.className = 'log-ver';
      badge.textContent = ver;
      if (ver.charAt(0) === '0') {
        const b = document.createElement('i');
        b.className = 'beta';
        b.textContent = 'beta';
        badge.appendChild(b);
      }
      when.appendChild(badge);
    }

    const notes = document.createElement('ul');
    notes.className = 'log-notes';
    day.notes.forEach(function(t) {
      const n = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = t;
      n.appendChild(span);
      notes.appendChild(n);
    });

    li.appendChild(when);
    li.appendChild(notes);
    list.appendChild(li);
  });

  $('logCount').textContent =
    (LATEST_VER ? 'v' + LATEST_VER + ' \u00b7 ' : '') + CHANGES.length + ' entries in ' + days.length + ' days';
}

    s:    [69, 70, 69, 57, 39, 27, 23, 28, 31, 21, 30, 47],
    l:    [39, 39, 34, 32, 32, 33, 32, 32, 35, 37, 37, 39]
  },
  // pure light has no cast in the paper, so the shelves carry the colour. a
  // row of muted ink swatches: steel through indigo and plum, brick and ochre,
  // olive, teal. mid-dark and under-saturated so they sit on white without
  // turning the page into a palette.
  pure: {
    hues: [212, 226, 248, 272, 300, 330, 6, 22, 40, 64, 104, 168],
    s:    [32, 44, 34, 30, 28, 36, 42, 44, 42, 32, 28, 30],
    l:    [44.5, 46, 46, 46, 46, 46, 46, 41.5, 36, 33, 36, 35.5]
  }
};

// a stop field can be one number or one per stop; read it at a fractional index
function stopAt(v, k, f) {
  if (typeof v === 'number') return v;
  return v[k] + (v[Math.min(v.length - 1, k + 1)] - v[k]) * f;
}

function rampFor(theme) {
  const cfg = RAMP_STOPS[theme] || RAMP_STOPS.night;
  const n = GROUPED.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : i / (n - 1) * (cfg.hues.length - 1);
    const k = Math.min(cfg.hues.length - 2, Math.floor(t));
    const f = t - k;
    const a = cfg.hues[k], b = cfg.hues[k + 1];
    const d = ((b - a + 540) % 360) - 180;
    out.push('hsl(' + ((a + d * f + 360) % 360).toFixed(1) + ', ' + stopAt(cfg.s, k, f).toFixed(1) + '%, ' + stopAt(cfg.l, k, f).toFixed(1) + '%)');
  }
  return out;
}

// write the ramp to the root as --g1..--gN so a theme switch recolours every
// shelf without re-rendering the page
function applyRamp() {
  const theme = document.documentElement.getAttribute('data-theme') || 'night';
  rampFor(theme).forEach((c, i) => document.documentElement.style.setProperty('--g' + (i + 1), c));
}

applyRamp();

function accentFor(g) {
  const i = GROUPED.indexOf(g);
  if (i < 0) return 'var(--accent)';
  return 'var(--g' + (i + 1) + ')';

function matches(x, q) {
  if (!q) return true;
  return x.n.toLowerCase().includes(q) || x.g.toLowerCase().includes(q);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const i = n.indexOf(' (');

  return escapeHtml(n);
}

  const meta = SERIES[en.key] || { n: en.games[0].n, cover: en.games[0].i, unit: 'games' };
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'card card--series';
  b.style.setProperty('--chars', Math.min(46, meta.n.length));

  if (cover) {
    inner += '<span class="card__art" style="--art:url(images/cards/' + cover + '.jpg);--art-t:url(images/cards/tile/' + cover + '.jpg);--art-s:url(images/cards/square/' + cover + '.jpg)"></span>';
  } else {

  inner += '<span class="card__f"></span>';

function render() {
  const q = term.trim().toLowerCase();

  const withReveal = (firstReveal || settleNext) && !REDUCED && !!revealIO;
  let shown = 0;

    if (!items.length) return;
    shown += items.length;
    const cards = collapse(items);

    const sec = document.createElement('section');

    const grid = document.createElement('div');

    cards.forEach(en => {
      if (en.games) { grid.appendChild(seriesCard(en, g)); return; }

      const x = en.game;
      const a = document.createElement('a');
      const art = !!x.i;
      a.className = 'card' + (x.d ? ' dl' : '') + (art ? '' : ' plate');
      // every card points at this shelf, not at the host it was imported
      // from: hover, middle click and "new tab" all stay on our own address.
      a.href = x.d ? x.u : '#play=' + encodeURIComponent(x.n);
      a.style.setProperty('--chars', Math.min(46, x.n.length));

      let inner = '';
      if (art) {
        inner += '<span class="card__art" style="--art:url(images/cards/' + x.i + '.jpg);--art-t:url(images/cards/tile/' + x.i + '.jpg);--art-s:url(images/cards/square/' + x.i + '.jpg)"></span>';
      }
      inner += '<span class="card__t">' + titleHtml(x.n) + '</span>';
      if (isBig(x)) inner += bigDot();
      inner += '<span class="card__f"></span>';

      const box = document.createElement('span');
      box.className = 'card__in';
      box.innerHTML = inner;
      a.appendChild(box);

      if (x.d) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      } else {
        a.onclick = ev => { ev.preventDefault(); openGame(x); };
      }
      grid.appendChild(a);
    });
    if (cards.length <= 2) grid.classList.add('grid--few');
    if (cards.length === 1) grid.classList.add('grid--one');

    sec.appendChild(head);
    sec.appendChild(grid);
    if (withReveal) sec.classList.add('reveal');
    listEl.appendChild(sec);
  });

  emptyEl.style.display = shown ? 'none' : 'block';

  const pool = GAMES.filter(x => !x.d && (group === 'All' || x.g === group) && matches(x, q));
  shuffleBtn.disabled = pool.length === 0;

  if (settleNext && !REDUCED) {
    listEl.animate(
      [
        { opacity: .45, transform: 'translateY(6px)' },
        { opacity: 1, transform: 'none' }
      ],
      { duration: 200, easing: 'cubic-bezier(.2,.65,.3,1)' }
    );
  }
  settleNext = false;
  firstReveal = false;
  fitTitles();
  primeArt();
  renderRecent();
  renderPick();

  // never leave sections invisible: force reveal shortly after render
  if (document.querySelector('.sect.reveal:not(.in)')) {
    setTimeout(() => {
      if (revealIO) revealIO.disconnect();
      document.querySelectorAll('.sect.reveal').forEach(s => s.classList.add('in'));
    }, 900);
  }
}

function fitTitles() {
  const titles = listEl.querySelectorAll('.card__t');
  for (let i = 0; i < titles.length; i++) {
    const t = titles[i];
    t.style.fontSize = '';
    let guard = 0;
    while (guard++ < 8) {
      const cs = getComputedStyle(t);
      const lh = parseFloat(cs.lineHeight);
      const h = t.getBoundingClientRect().height;
      if (!lh || h <= lh * 2 + 1) break;
      const fs = parseFloat(cs.fontSize);
      if (fs <= 10.6) break;
      const factor = Math.max(0.72, Math.min(0.97, (lh * 2) / h));
      t.style.fontSize = Math.max(10.6, fs * factor) + 'px';
    }
  }
}

let fitTimer = 0;
addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitTitles, 120);
});

function readRecent() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.filter(n => GAMES.some(g => g.n === n && !g.d));
  } catch (e) {
    return [];
  }
}

function pushRecent(name) {
  const list = readRecent().filter(n => n !== name);
  list.unshift(name);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch (e) {}
  renderRecent();
}

// game of the day: a deterministic daily walk through the whole catalogue.
// each game gets exactly one day per cycle; eaglercraft is the exception --
// only its 1.16.5 and 1.21.11 builds enter the pool, and one returns every
// seventh day. when the walk runs out the next cycle reshuffles and starts over.
const EAGLE_ANY = /^Eaglercraft\b/;
const EAGLE_OK = /^Eaglercraft (1\.16\.5|1\.21\.11)\b/;
const PICK_POOL = GAMES.filter(x => !EAGLE_ANY.test(x.n) || EAGLE_OK.test(x.n));
const PICK_BASE = PICK_POOL.filter(x => !EAGLE_ANY.test(x.n));
const PICK_EAGLES = PICK_POOL.filter(x => EAGLE_ANY.test(x.n));

function seededShuffle(arr, seed) {
  const a = arr.slice();
  let s = seed >>> 0;
  function rnd() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickSchedule(cycle) {
  const base = seededShuffle(PICK_BASE, cycle * 7919 + 13);
  const out = [];
  let e = cycle % PICK_EAGLES.length;
  base.forEach((g, i) => {
    out.push(g);
    if ((i + 1) % 7 === 0 && i < base.length - 1) {
      out.push(PICK_EAGLES[e % PICK_EAGLES.length]);
      e++;
    }
  });
  return out;
}

function dailyPick() {
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const day = Math.floor((today - Date.UTC(2026, 0, 1)) / 86400000);
  const len = PICK_BASE.length + Math.floor((PICK_BASE.length - 1) / 7);
  const cycle = Math.floor(day / len);
  const pos = day - cycle * len;
  const schedule = pickSchedule(cycle);
  return { game: schedule[pos], day: pos + 1, len: len };
}

function renderPick() {
  const box = $('pick');
  const show = !term.trim();
  box.hidden = !show;
  if (!show) return;
  const p = dailyPick();
  const x = p.game;
  if (!x) { box.hidden = true; return; }
  box.style.setProperty('--ga', accentFor(x.g));
  const art = $('pickArt');
  art.style.backgroundImage = x.i ? 'url(images/cards/' + x.i + '.jpg)' : '';
  $('pickName').textContent = x.n;
  $('pickMeta').textContent = x.g;
  const a = $('pickLink');
  a.href = x.u;
  a.setAttribute('aria-label', 'Game of the day: ' + x.n);
  if (x.d) {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.onclick = null;
  } else {
    a.removeAttribute('target');
    a.removeAttribute('rel');
    a.onclick = ev => { ev.preventDefault(); openGame(x); };
  }
}

function renderRecent() {
  const list = readRecent();
  const show = list.length > 0 && group === 'All' && !term.trim();
  $('recent').hidden = !show;
  if (!show) return;

  const ul = $('recentList');
  ul.innerHTML = '';
  list.forEach(n => {
    const x = GAMES.find(g => g.n === n);
    if (!x) return;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = x.u;
    a.textContent = n;
    a.style.setProperty('--ga', accentFor(x.g));
    a.onclick = ev => { ev.preventDefault(); openGame(x); };
    li.appendChild(a);
    ul.appendChild(li);
  });
}

let closeTimer = null;
let fadeTimer = null;

function openGame(x) {
  clearTimeout(closeTimer);
  clearTimeout(fadeTimer);
  ovName.textContent = x.n;
  ovNote.hidden = false;
  ovNew.href = '#play=' + encodeURIComponent(x.n);

$('ovClose').onclick = closeGame;

frame.addEventListener('load', () => {

});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('choose').hidden) { closeChooser(); return; }
    if (logOpen) { closeLog(); return; }
    if (overlay.classList.contains('open')) closeGame();
    else if (document.activeElement === $('q') && term) {
      $('q').value = '';

      render();

    $('q').focus();

});

// Enter in the search box should never reload the page
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

let copyTimer = null;
ovCopy.onclick = () => {
  const url = location.href;
  const done = () => {
    ovCopy.textContent = 'copied';
    ovCopy.classList.add('done');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      ovCopy.textContent = 'copy link';
      ovCopy.classList.remove('done');
    }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, fallback);
  } else {
    fallback();
  }
};

if (!frame.requestFullscreen && !frame.webkitRequestFullscreen) {
  ovFull.hidden = true;
} else {
  ovFull.onclick = () => {
    const el = document.fullscreenElement || document.webkitFullscreenElement;
    if (el) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return;
    }
    const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
    try {
      const p = req.call(frame);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  };
}

const setBtn = $('setBtn');

  { id:'dusk',   label:'dusk',        bg:'#14121f' },
  { id:'abyss',  label:'abyss',       bg:'#081418' },

function currentTheme() {
  const t = rootEl.getAttribute('data-theme');
  return THEMES.some(x => x.id === t) ? t : 'night';
}

function syncThemes() {
  const now = currentTheme();
  THEMES.forEach(t => {
    const b = setPanel.querySelector('[data-t="' + t.id + '"]');
    if (b) b.setAttribute('aria-checked', t.id === now ? 'true' : 'false');
  });
  setSwatch.className = 'sw sw-' + now;
  const t = THEMES.find(x => x.id === now);
  setLab.textContent = t ? t.label : 'themes';
  if (themeMeta && t) themeMeta.setAttribute('content', t.bg);
}

function openSet() {
  setPanel.hidden = false;
  setBtn.setAttribute('aria-expanded', 'true');
  document.addEventListener('pointerdown', onSetAway, true);
  document.addEventListener('keydown', onSetKey, true);
}

function closeSet() {
  if (setPanel.hidden) return;
  setPanel.hidden = true;
  setBtn.setAttribute('aria-expanded', 'false');
  document.removeEventListener('pointerdown', onSetAway, true);
  document.removeEventListener('keydown', onSetKey, true);
}

function onSetAway(e) {
  if (setBtn.contains(e.target) || setPanel.contains(e.target)) return;
  closeSet();

function onSetKey(e) {

  if (setPanel.hidden) openSet(); else closeSet();
};

const themeBtns = setPanel.querySelectorAll('button[data-t]');
themeBtns.forEach(b => {
  b.onclick = () => {
    const id = b.dataset.t;
    if (!THEMES.some(x => x.id === id)) return;
    rootEl.setAttribute('data-theme', id);
    try { localStorage.setItem(THEME_KEY, id); } catch (e) {}
    applyRamp();
    syncThemes();
    closeSet();
    if (!REDUCED) {
      rootEl.classList.add('theming');
      clearTimeout(themeTimer);
      themeTimer = setTimeout(() => rootEl.classList.remove('theming'), 280);
    }
  };
});

syncThemes();

// tile shape: banner keeps the 3:1 artwork whole, tile and square crop it to
// a picture and move the title to the foot. the panel stays open so the two
// crops can be compared without reopening it.
const SHAPE_KEY = 'backpage:shape';
const SHAPES = ['banner', 'tile', 'square'];

function currentShape() {
  const s = rootEl.getAttribute('data-shape');
  return SHAPES.indexOf(s) >= 0 ? s : 'banner';
}

function syncShape() {
  const now = currentShape();
  document.querySelectorAll('button[data-shape]').forEach(b => {
    b.setAttribute('aria-checked', b.dataset.shape === now ? 'true' : 'false');
  });
}

document.querySelectorAll('button[data-shape]').forEach(b => {
  b.onclick = () => {
    const id = b.dataset.shape;
    if (SHAPES.indexOf(id) < 0) return;
    if (id === 'banner') rootEl.removeAttribute('data-shape');
    else rootEl.setAttribute('data-shape', id);
    try { localStorage.setItem(SHAPE_KEY, id); } catch (e) {}
    syncShape();
  };
});

syncShape();

render();
openFromHash();
</script>
</body>
</html>
