<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171412">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('backpage:theme'); } catch (e) {}
  if (t === 'light') t = 'day';      // old saved value
  if (t === 'dark') t = 'night';     // old saved value
  var ok = ['night','dusk','abyss','matcha','day'];
  if (ok.indexOf(t) < 0) t = 'night';
  if (t !== 'night') document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content',
    { dusk:'#14121f', abyss:'#081418', matcha:'#f1f3e6', day:'#f8f3e9' }[t] || '#171412');
})();
</script>
<title>Backpage</title>
<style>
/* =========================================================
   Backpage - design system
   Themes: night (default), dusk, day
   Each game group carries its own accent (--ga), set by JS.
   ========================================================= */

:root{
  color-scheme:dark;

  /* night (default) */
  --paper:#171412;
  --card:#201c19;
  --ink:#eee5d7;
  --muted:#b6a795;
  --faint:#8b7d6d;
  --rule:#3a332c;
  --edge:#52493f;
  --hover:#26211d;
  --press:#2b2621;
  --focus:#5f5347;
  --dot:#4a4137;
  --wash:#3b2a1e;
  --sel:#3e372e;
  --accent:#e07a4f;
  --tile:#16120e;
  --stage:#0f0d0b;

  --serif:Georgia,"Iowan Old Style","Times New Roman",Times,serif;
  --head:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --fast:120ms;
  --ease:cubic-bezier(.2,.65,.3,1);
}

html[data-theme="dusk"]{
  color-scheme:dark;
  --paper:#14121f;
  --card:#1b1829;
  --ink:#e6e2f2;
  --muted:#a8a1c0;
  --faint:#7d7696;
  --rule:#2f2a45;
  --edge:#413a5c;
  --hover:#211d33;
  --press:#262139;
  --focus:#514a70;
  --dot:#3c3656;
  --wash:#2e2445;
  --sel:#352e52;
  --accent:#a78bfa;
  --tile:#171324;
  --stage:#0a0813;
}

html[data-theme="abyss"]{
  color-scheme:dark;
  --paper:#081418;
  --card:#0f222a;
  --ink:#e0ebeb;
  --muted:#9cb4b4;
  --faint:#6c8587;
  --rule:#1c3138;
  --edge:#2d454d;
  --hover:#142a32;
  --press:#172f37;
  --focus:#3d5a63;
  --dot:#274149;
  --wash:#133a33;
  --sel:#153f40;
  --accent:#37c1a8;
  --tile:#0c1c21;
  --stage:#050e12;
}

html[data-theme="matcha"]{
  color-scheme:light;
  --paper:#f1f3e6;
  --card:#fdfcf2;
  --ink:#222a1f;
  --muted:#606a55;
  --faint:#8f987f;
  --rule:#dce2cf;
  --edge:#bfc9ae;
  --hover:#ffffff;
  --press:#edefe1;
  --focus:#b7c3a2;
  --dot:#c6cfbb;
  --wash:#e9efda;
  --sel:#dde7c9;
  --accent:#577b31;
  --tile:#2c2d21;
  --stage:#12100c;
}

html[data-theme="day"]{
  color-scheme:light;
  --paper:#f8f3e9;
  --card:#fffdf6;
  --ink:#211d19;
  --muted:#6e675e;
  --faint:#a1968a;
  --rule:#e6dcc9;
  --edge:#cfc3ae;
  --hover:#ffffff;
  --press:#f3ecdd;
  --focus:#c2b7a4;
  --dot:#d3c7b4;
  --wash:#f7e7d6;
  --sel:#eddffc;
  --accent:#c2471d;
  --tile:#2b2114;
  --stage:#171310;
}

*{box-sizing:border-box}
html{
  font-size:clamp(87.5%, 1.6vw + 81.7%, 115%);
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  background:
    radial-gradient(1100px 460px at 18% -12%, color-mix(in oklab, var(--accent) 7%, transparent), transparent 72%),
    radial-gradient(900px 420px at 88% -14%, color-mix(in oklab, var(--ga, var(--accent)) 6%, transparent), transparent 74%),
    var(--paper);
  color:var(--ink);
  font:400 1rem/1.6 var(--serif);
  -webkit-font-smoothing:antialiased;
  animation:settle .18s ease-out both;
}
@keyframes settle{from{opacity:0}to{opacity:1}}

/* section reveal on first view (JS adds .reveal/.in, respects reduced motion) */
.sect.reveal{opacity:0;transform:translateY(12px)}
.sect.reveal.in{
  opacity:1;transform:none;
  transition:opacity .36s var(--ease), transform .36s var(--ease);
}

/* settings panel pop */
.set-panel{transform-origin:top right}
.set-panel:not([hidden]){animation:pop .17s var(--ease)}
@keyframes pop{
  from{opacity:0;transform:scale(.96) translateY(-4px)}
  to{opacity:1;transform:none}
}

/* log panel slide */
.log-panel:not([hidden]){animation:rise .22s var(--ease)}
@keyframes rise{
  from{transform:translateY(14px);opacity:.4}
  to{transform:none;opacity:1}
}

.wrap{
  max-width:clamp(74rem, 78vw, 94rem);
  margin:0 auto;
  padding:0 clamp(16px, 2.4vw, 40px);
}
a{color:inherit}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{
  background:var(--edge);border-radius:99px;
  border:3px solid var(--paper);
}
::-webkit-scrollbar-thumb:hover{background:var(--focus)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ------------------------------------------------ header */

header{
  position:sticky;top:0;z-index:30;
  border-bottom:1px solid var(--rule);
  background:
    linear-gradient(180deg, color-mix(in oklab, var(--accent) 6%, var(--paper)), color-mix(in oklab, var(--paper) 90%, transparent) 82%),
    var(--paper);
  backdrop-filter:blur(10px) saturate(1.15);
  -webkit-backdrop-filter:blur(10px) saturate(1.15);
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;
  background:linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 55%, transparent) 30%, color-mix(in oklab, var(--accent) 55%, transparent) 70%, transparent);
  pointer-events:none;
}
.top{
  display:flex;align-items:baseline;flex-wrap:wrap;
  gap:clamp(10px, .9rem, 20px);
  padding:clamp(12px, 1.1rem, 20px) 0 clamp(11px, 1rem, 18px);
}
.brand{
  display:inline-flex;align-items:baseline;gap:.5rem;
  font-family:var(--head);
  font-size:clamp(1.18rem, 2.4vw, 1.45rem);font-weight:700;letter-spacing:-.005em;
}
.brand::before{
  content:"";width:.5rem;height:.5rem;flex:none;align-self:center;
  transform:rotate(45deg);
  background:linear-gradient(135deg, color-mix(in oklab, var(--accent) 78%, #fff), var(--accent));
  box-shadow:0 0 8px color-mix(in oklab, var(--accent) 45%, transparent);
}
.brand i{font-style:normal;color:var(--accent)}
.top .grow{flex:1 1 1rem}
.count{
  border:1px solid var(--rule);border-radius:99px;
  padding:.14rem .62rem;
  background:color-mix(in oklab, var(--card) 55%, var(--paper));
  font-family:var(--serif);font-style:italic;
  font-size:.74rem;color:var(--muted);white-space:nowrap;
  transition:opacity var(--fast) linear;
}

/* theme settings: menu button + dropdown panel */
.set{position:relative}
.set-btn{
  display:inline-flex;align-items:center;gap:.45rem;
  background:var(--card);border:1px solid var(--rule);border-radius:99px;
  padding:.24rem .62rem;cursor:pointer;
  font:inherit;font-style:italic;font-size:.78rem;
  color:var(--muted);white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.set-btn::after{
  content:"";width:.42rem;height:.42rem;flex:none;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-.1rem);
  opacity:.55;
  transition:transform var(--fast) var(--ease);
}
.set-btn:hover{color:var(--ink);border-color:var(--edge)}
.set-btn[aria-expanded="true"]{
  color:var(--ink);
  border-color:color-mix(in oklab, var(--accent) 45%, var(--rule));
  background:color-mix(in oklab, var(--accent) 10%, var(--card));
}
.set-btn[aria-expanded="true"]::after{transform:rotate(225deg)}
.set-btn .sw{width:.95rem;height:.62rem;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--ink) 22%, transparent)}
.set-panel{
  position:absolute;top:calc(100% + .55rem);right:0;z-index:44;
  min-width:16.5rem;
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:12px;
  box-shadow:0 8px 28px -6px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.28);
  padding:.45rem;
}
.set-panel[hidden]{display:none}
.set-tit{
  font-style:italic;font-size:.7rem;color:var(--faint);
  padding:.3rem .6rem .35rem;letter-spacing:.05em;
}
.set-opt{
  display:flex;align-items:center;gap:.6rem;
  width:100%;
  background:none;border:0;padding:.5rem .6rem;margin:0;
  border-radius:8px;cursor:pointer;text-align:left;
  font:inherit;color:var(--muted);
  transition:background-color var(--fast) linear, color var(--fast) linear;
}
.set-opt:hover{background:color-mix(in oklab, var(--accent) 8%, var(--hover));color:var(--ink)}
.set-opt[aria-checked="true"]{
  background:color-mix(in oklab, var(--accent) 14%, var(--card));
  color:var(--ink);
}
.set-opt[aria-checked="true"] .set-name{font-weight:600}
.set-opt .sw{width:1.7rem;height:1.05rem;border-radius:5px;flex:none;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--ink) 22%, transparent)}
.set-opt .set-name{font-size:.84rem;white-space:nowrap}
.set-opt .set-desc{margin-left:auto;font-style:italic;font-size:.72rem;color:var(--faint)}
.set-opt[aria-checked="true"]::after{
  content:"";width:.4rem;height:.4rem;flex:none;
  background:var(--accent);transform:rotate(45deg);
  margin-left:.15rem;
}
.sw-night{background:linear-gradient(135deg, #4a3322 0%, #171412 62%)}
.sw-dusk{background:linear-gradient(135deg, #7a63c4 0%, #14121f 66%)}
.sw-abyss{background:linear-gradient(135deg, #37c1a8 0%, #081418 68%)}
.sw-matcha{background:linear-gradient(135deg, #7ba250 0%, #c9d6a5 55%, #f2f4e9 100%)}
.sw-day{background:linear-gradient(135deg, #ffd9a0 0%, #f6efdf 60%, #fffdf6 100%)}

.search{position:relative}
.search::after{
  content:"";position:absolute;
  left:.62rem;top:50%;width:.78rem;height:.78rem;
  transform:translateY(-50%);
  background:var(--faint);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='6.7'/><path d='M15.6 15.6 21 21'/></svg>") center / 100% no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='6.7'/><path d='M15.6 15.6 21 21'/></svg>") center / 100% no-repeat;
  pointer-events:none;
}
.search input{
  width:clamp(130px, 18vw, 220px);
  padding:.36rem .6rem .36rem 1.85rem;
  border:1px solid var(--rule);border-radius:99px;
  background:var(--card);color:var(--ink);
  font:inherit;font-size:.84rem;outline:none;
  transition:border-color var(--fast) linear, background-color var(--fast) linear;
}
.search input:focus{border-color:color-mix(in oklab, var(--accent) 55%, var(--rule));background:var(--hover)}
.search input::placeholder{color:var(--faint)}

/* ---------------------------------------- recently played */

.recent{
  display:flex;flex-direction:column;gap:.55rem;
  margin:clamp(14px,1.4rem,24px) 0 clamp(20px, 2rem, 32px);
  padding:clamp(12px, 1.4rem, 20px) clamp(16px, 2.4vw, 40px);
  border:1px solid color-mix(in oklab, var(--accent) 22%, var(--rule));
  border-radius:12px;
  background:
    linear-gradient(180deg, color-mix(in oklab, var(--accent) 5%, var(--card)), var(--card) 55%);
}
.recent[hidden]{display:none}
.recent-lab{
  display:block;font-family:var(--head);font-weight:700;letter-spacing:.008em;
  font-size:clamp(.9rem, 1.6vw, 1.25rem);color:var(--ink);
  margin:0 0 .25rem;
}
.recent-list{display:flex;flex-wrap:wrap;margin:0;padding:0;list-style:none;gap:.4rem}
.recent-list li{margin:0}
.recent-list a{
  display:inline-flex;align-items:center;gap:.42rem;
  color:var(--muted);text-decoration:none;font-size:.86rem;
  padding:.16rem .62rem .16rem .5rem;border-radius:99px;
  border:1px solid var(--rule);
  background:color-mix(in oklab, var(--card) 70%, var(--paper));
  transition:border-color var(--fast) linear, color var(--fast) linear, transform var(--fast) var(--ease);
}
.recent-list a::before{
  content:"";width:.5rem;height:.5rem;flex:none;border-radius:99px;
  background:var(--ga, var(--accent));
  box-shadow:0 0 0 1px color-mix(in oklab, var(--ink) 14%, transparent);
}
.recent-list a:hover{
  color:var(--ink);
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 60%, var(--rule));
  transform:translateY(-1px);
}
.recent-list a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ------------------------------------------------ filters */

.filter-bar{
  display:flex;flex-direction:column;gap:.42rem;
  margin:0 0 clamp(16px, 1.8rem, 26px);
}
.filters{
  display:flex;flex-wrap:wrap;align-items:center;gap:.34rem;
  margin:0;padding:0;list-style:none;
}
.filters li{margin:0}
.filters button{
  display:inline-flex;align-items:baseline;gap:.32rem;
  background:var(--card);border:1px solid var(--rule);border-radius:99px;
  padding:.24rem .58rem;margin:0;cursor:pointer;
  font:inherit;font-size:.78rem;color:var(--muted);
  transition:color var(--fast) linear, border-color var(--fast) linear, background var(--fast) linear, transform var(--fast) var(--ease);
}
.filters button:hover{
  color:var(--ink);
  border-color:var(--edge);
  background:color-mix(in oklab, var(--card) 60%, var(--hover));
  transform:translateY(-1px);
}
.filters button.on{
  color:var(--ink);font-weight:600;
  border-color:color-mix(in oklab, var(--ga, var(--accent)) 55%, var(--edge));
  background:color-mix(in oklab, var(--ga, var(--accent)) 20%, var(--card));
}
.filters--views button.on{
  color:var(--ink);
  border-color:color-mix(in oklab, var(--accent) 55%, var(--edge));
  background:color-mix(in oklab, var(--accent) 18%, var(--card));
}
.filters button.zero{opacity:.4}
.filters button.zero:hover{opacity:.7}
.filters .group .dot{
  width:.44rem;height:.44rem;flex:none;align-self:center;
  border-radius:99px;
  background:var(--ga, var(--faint));
  opacity:.85;
  transition:opacity var(--fast) linear;
}
.filters button.on .dot{opacity:1}
.filter-count{font-size:.7rem;color:var(--faint);font-family:var(--serif)}
.filters button.on .filter-count{color:var(--muted)}
.filters--groups{
  padding-bottom:.1rem;
}
@media (max-width:639px){
  .filters--groups{
    flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 2.4rem),transparent);
    mask-image:linear-gradient(to right,#000 calc(100% - 2.4rem),transparent);
  }
  .filters--groups::-webkit-scrollbar{display:none}
  .filters--groups li{flex:none}
}
@media (max-width:899px){
  .filters button{padding:.2rem .46rem;font-size:.74rem}
  .filter-count{font-size:.66rem}
}
.filters .group .lbl-s{display:none}
/* tablet-window band: shorter labels, tighter chips */
@media (min-width:640px) and (max-width:1079px){
  .filters button{padding:.16rem .4rem;font-size:.7rem}
  .filters{gap:.26rem}
  .filter-count{font-size:.62rem}
  .filters .group .dot{width:.34rem;height:.34rem}
  .filters .group .lbl{display:none}
  .filters .group .lbl-s{display:inline}
}
@media (max-width:560px){
  .count{display:none}
}
.filters--views{padding-top:.12rem;border-top:1px solid var(--rule)}
@media (min-width:1080px){
  .filter-bar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:.4rem .9rem}
  .filters--groups{flex-wrap:wrap;overflow:visible}
  .filters--views{border-top:0;padding-top:0}
  .filters--views::before{
    content:"";width:1px;height:1.1rem;background:var(--rule);
    margin-right:.5rem;align-self:center;
  }
}
.filters .shuffle{
  font-style:italic;color:var(--faint);
  padding:.22rem .6rem;border-color:transparent;background:none;
}
.filters .shuffle::after{
  content:"\21bb";margin-left:.14rem;font-style:normal;
  color:var(--accent);opacity:.8;
}
.filters .shuffle:hover{color:var(--ink);border-color:var(--edge);background:none;transform:rotate(-14deg)}
.filters .shuffle:disabled{opacity:.4;cursor:default;color:var(--faint)}
.filters .shuffle:disabled:hover{color:var(--faint);transform:none;background:none}

/* ---------------------------------------------  sections */

.sect{margin:0 0 clamp(24px, 2.3rem, 40px)}
.sect-head{display:flex;align-items:baseline;gap:.55rem;margin:0 0 .75rem}
.sect-head h2{
  margin:0;font-family:var(--head);
  font-size:1.02rem;font-weight:700;letter-spacing:.005em;
  color:var(--ink);
  display:inline-flex;align-items:center;gap:.45rem;
  padding-bottom:.3rem;
  border-bottom:2px solid color-mix(in oklab, var(--ga, var(--accent)) 78%, transparent);
}
.sect-head h2::before{
  content:"";width:.44rem;height:.44rem;flex:none;
  transform:rotate(45deg);
  background:color-mix(in oklab, var(--ga, var(--accent)) 85%, #fff);
}
.sect-head .n{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;
  color:color-mix(in oklab, var(--ga, var(--accent)) 74%, #fff);
  white-space:nowrap;
}
.sect-head .rule{
  flex:1;height:1px;transform:translateY(-.25rem);margin-left:.55rem;
  background:linear-gradient(90deg,
    color-mix(in oklab, var(--ga, var(--accent)) 40%, transparent),
    var(--rule) 46%,
    transparent);
}

/* -------------------------------------------------- grid */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(clamp(11.5rem, 18vw, 13.75rem), 1fr));
  align-items:stretch;
  gap:clamp(.5rem, .62vw, .75rem);
}
.card{
  position:relative;display:block;
  width:auto;min-width:0;max-width:none;
  aspect-ratio:3.15/1;
  border-radius:5px;
  background:var(--tile);
  text-decoration:none;
  overflow:hidden;
  isolation:isolate;
  transition:box-shadow 180ms var(--ease), transform 180ms var(--ease);
}
.card:hover{transform:translateY(-2px)}
.card:hover{
  box-shadow:
    0 0 0 1px color-mix(in oklab, var(--ga, var(--accent)) 52%, transparent),
    0 10px 26px -10px color-mix(in oklab, var(--ga, var(--accent)) 42%, transparent),
    0 4px 14px -6px rgba(0,0,0,.45);
}
.card:active{transform:translateY(-1px)}
.card:focus-visible{
  outline:none;border-radius:6px;
  box-shadow:0 0 0 2px color-mix(in oklab, var(--ga, var(--accent)) 88%, #fff);
}

.card__in{
  position:relative;display:block;width:100%;height:100%;
  container-type:inline-size;
}

.card__art{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:saturate(.9) contrast(1.04) brightness(.97);
  transform:scale(1);
  transition:filter 200ms linear, transform 320ms var(--ease);
}
.card:hover .card__art{filter:saturate(1) contrast(1.05) brightness(1.03);transform:scale(1.035)}

/* scrim: darkens the left where the title sits, and the outer edges */
.card::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(8,9,12,.90) 0%, rgba(8,9,12,.84) 34%, rgba(8,9,12,.70) 54%, rgba(8,9,12,.42) 66%, rgba(8,9,12,.20) 80%, rgba(8,9,12,.58) 100%),
    radial-gradient(42% 100% at 94% 50%, rgba(8,9,12,.76) 0%, rgba(8,9,12,.50) 55%, rgba(8,9,12,0) 100%),
    linear-gradient(0deg, rgba(8,9,12,.66) 0%, rgba(8,9,12,0) 44%, rgba(8,9,12,.24) 100%);
  box-shadow:inset 0 0 2.2rem rgba(0,0,0,.55);
}
.card.plate::before{
  background:radial-gradient(130% 150% at 18% 46%, color-mix(in oklab, var(--ga, #8b7d6d) 26%, rgba(62,58,50,.6)) 0%, rgba(24,21,17,.74) 52%, rgba(12,10,8,.94) 100%);
}
.card.plate{
  background:
    radial-gradient(120% 130% at 24% 42%, color-mix(in oklab, var(--ga, #2b2721) 22%, #2b2721) 0%, #1a1713 48%, #0e0c0a 100%);
}

/* theme-tuned art: same title-zone darkness in every theme, hue and edge

/* on phones the banners run full width, like the reference */
@media (max-width:560px){
  .grid{grid-template-columns:1fr;gap:.6rem}

/* frame: 9-slice so corners stay crisp at any width */
.card__f{
  position:absolute;z-index:3;pointer-events:none;
  inset:clamp(3px, 1.9cqw, 9px);
  border:12px solid transparent;
  border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23eae3d4' stroke-width='1.45' stroke-linecap='round'><path d='M6.2 .5H41.8A5.7 5.7 0 0 1 47.5 6.2V41.8A5.7 5.7 0 0 1 41.8 47.5H6.2A5.7 5.7 0 0 1 .5 41.8V6.2A5.7 5.7 0 0 1 6.2 .5Z'/><path stroke-width='.95' d='M6.2 3.5H41.8A2.7 2.7 0 0 1 44.5 6.2V41.8A2.7 2.7 0 0 1 41.8 44.5H6.2A2.7 2.7 0 0 1 3.5 41.8V6.2A2.7 2.7 0 0 1 6.2 3.5Z' opacity='.22'/></svg>") 16 fill / 1 / 0 stretch;
  opacity:.82;
  transition:opacity 160ms linear;
}
.card:hover .card__f{opacity:1}

/* small jewels straddling the frame at top and bottom centre */
.card__f::before,.card__f::after{
  content:"";position:absolute;left:50%;
  width:.3rem;height:.3rem;
  background:rgba(234,227,212,.8);
  transform:translateX(-50%) rotate(45deg);
  transition:background-color 160ms linear;
}
.card__f::before{top:-.24rem}
.card__f::after{bottom:-.24rem}
.card:hover .card__f::before,
.card:hover .card__f::after{
  background:color-mix(in oklab, var(--ga, var(--accent)) 88%, #fff);
}

.card__t{
  position:absolute;z-index:2;
  left:.95rem;right:.95rem;top:50%;
  transform:translateY(-50%);
  margin:0;
  font-family:var(--head);
  font-size:clamp(.88rem, 5.4cqw, 1.5rem);
  font-weight:500;line-height:1.14;letter-spacing:.008em;
  color:#f1ebdf;
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.55);
  overflow-wrap:break-word;
  text-wrap:pretty;
}
.nw{white-space:nowrap}

/* size pill in the top-right corner */
.card__s{
  position:absolute;z-index:2;
  right:.62rem;top:.55rem;
  font-family:var(--serif);font-style:italic;
  font-size:clamp(.62rem, 2.5cqw, .74rem);
  color:rgba(241,235,223,.92);
  padding:.08rem .48rem;
  border-radius:99px;
  background:rgba(10,9,8,.52);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  transition:background-color 150ms linear, color 150ms linear;
}
.card:hover .card__s{background-color:rgba(10,9,8,.68)}
.card.dl .card__s{
  color:color-mix(in oklab, var(--accent) 62%, #fff);
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 55%, transparent);
}

.card__mark{
  position:absolute;z-index:0;
  right:.3rem;bottom:-.28em;
  font-family:var(--head);font-weight:700;
  font-size:clamp(3.6rem, 26cqw, 7rem);
  line-height:.8;
  color:rgba(232,225,210,.11);
  letter-spacing:-.02em;
  user-select:none;
}
.card.plate .card__mark{z-index:2;color:rgba(232,225,210,.10)}

.card.dl .card__t::after{
  content:"\2193";color:color-mix(in oklab, var(--accent) 62%, #fff);margin-left:.28rem;font-size:.8em;
  display:inline-block;
  transition:transform var(--fast) var(--ease);
}
.card.dl:hover .card__t::after{transform:translateY(.12em)}

.empty{
  padding:3rem 0 4rem;color:var(--faint);display:none;
  font-family:var(--head);font-style:italic;

}

/* light themes: weave group accents toward ink so light ramp colours still read on paper */
html[data-theme="day"] .sect-head h2,
html[data-theme="matcha"] .sect-head h2{border-bottom-color:color-mix(in oklab, var(--ga) 60%, var(--ink))}

html[data-theme="matcha"] .sect-head h2::before{background:color-mix(in oklab, var(--ga) 58%, var(--ink))}

    0 0 0 1px color-mix(in oklab, var(--ga) 55%, var(--ink)),

    0 4px 14px -6px rgba(0,0,0,.25);

main.wrap{padding-bottom:clamp(30px, 3.2rem, 60px)}

/* ------------------------------------------- game overlay */

#overlay{
  position:fixed;inset:0;height:100dvh;z-index:50;
  display:flex;flex-direction:column;background:var(--stage);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .16s ease-out, visibility 0s linear .16s;
}
#overlay.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .16s ease-out;
}
.ov-bar{
  display:flex;align-items:center;gap:.55rem;
  padding:.5rem .8rem;
  border-bottom:2px solid color-mix(in oklab, var(--accent) 72%, transparent);
  background:
    linear-gradient(180deg, color-mix(in oklab, var(--accent) 7%, var(--card)), var(--card) 70%);
  color:var(--ink);
  font-size:.8rem;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transform:translateY(-.45rem);
  transition:transform .16s var(--ease);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
#overlay.open .ov-bar{transform:none}
.ov-title{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:.55rem;
  font-family:var(--head);font-size:.97rem;
  margin-right:.4rem;
}
.ov-title #ovName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-note{
  flex:none;font-family:var(--serif);font-style:italic;
  font-size:.74rem;color:var(--faint);
  display:inline-flex;align-items:center;gap:.32rem;
}
.ov-note::before{
  content:"";width:.5em;height:.5em;border-radius:99px;
  background:var(--accent);
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ov-note[hidden]{display:none}
.ov-bar a,.ov-bar button{
  background:none;
  border:1px solid var(--rule);border-radius:99px;
  padding:.22rem .72rem;cursor:pointer;font:inherit;font-size:.78rem;
  color:var(--muted);text-decoration:none;white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;
}
.ov-bar a:hover,.ov-bar button:hover{
  color:var(--accent);
  border-color:color-mix(in oklab, var(--accent) 45%, var(--rule));
}
.ov-bar button.done{
  color:var(--ink);
  border-color:color-mix(in oklab, var(--accent) 55%, var(--rule));
}
#frame{
  flex:1;width:100%;border:0;background:#000;
  opacity:0;transition:opacity .2s ease-out;
}
#frame.ready{opacity:1}
body.locked{overflow:hidden}

/* ------------------------------------------------ responsive */

@media (max-width:719px){

}

}

/* ------------------------------------------------ change log */

.log-btn{
  position:relative;
  background:none;border:1px solid transparent;border-radius:99px;
  padding:.2rem .62rem;margin:0;cursor:pointer;
  font:inherit;font-style:italic;font-size:.78rem;

}
.log-btn::before{
  content:"";display:inline-block;

  background:var(--accent);margin-right:.4rem;
  vertical-align:.04em;
}

  color:var(--ink);
  border-color:color-mix(in oklab, var(--accent) 45%, var(--rule));

.log-scrim{
  position:fixed;inset:0;z-index:39;

  -webkit-backdrop-filter:blur(2px);
  opacity:0;transition:opacity .18s linear;
}

.log-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-height:min(62vh, 33rem);overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--card);

  box-shadow:0 -12px 36px rgba(0,0,0,.30), inset 0 1px 0 color-mix(in oklab, var(--ink) 7%, transparent);
  padding:0 clamp(16px, 2.4vw, 40px) max(1.25rem, env(safe-area-inset-bottom));
}
.log-panel[hidden]{display:none}
.log-panel__in{max-width:52rem;margin:0 auto}
.log-handle{
  width:2.4rem;height:.24rem;margin:.6rem auto .85rem;
  border-radius:99px;
  background:color-mix(in oklab, var(--accent) 55%, var(--edge));

}
.log-head{
  display:flex;align-items:baseline;gap:.55rem;

}
.log-head h3{

  font-size:1rem;font-weight:700;letter-spacing:.005em;
}
.log-head .n{

  padding:.14rem .6rem;cursor:pointer;
  font:inherit;font-style:italic;font-size:.76rem;
  color:var(--faint);white-space:nowrap;
  transition:color var(--fast) linear, border-color var(--fast) linear;

.log-head button:hover{color:var(--ink);border-color:var(--edge)}

.log-list{margin:0;padding:0;list-style:none}
.log-list li{
  position:relative;

.log-list li::before{
  content:"";position:absolute;left:0;top:1.18em;
  width:.34rem;height:.34rem;border-radius:99px;
  background:var(--edge);
}
.log-list li:first-child::before{background:var(--accent);box-shadow:0 0 6px color-mix(in oklab, var(--accent) 55%, transparent)}
.log-list li:first-child span{color:var(--ink)}
.log-list time{
  font-family:var(--serif);font-style:italic;

@media (max-width:560px){
  .log-list li{grid-template-columns:1fr;gap:.08rem;padding:.55rem 0 .55rem .8rem}

}

  {d:'6 nov 2026', t:'filter bar reworked: a count on every group, all tiles / with banners / plates only views, and it scrolls instead of stacking on phones'},

];
const logBtn = $('logBtn');
const logPanel = $('logPanel');
const logScrim = $('logScrim');
let logOpen = false;

function renderLog() {
  const list = $('logList');
  list.innerHTML = '';
  CHANGES.forEach(function(c) {
    const li = document.createElement('li');
    const time = document.createElement('time');
    time.textContent = c.d;
    const span = document.createElement('span');
    span.textContent = c.t;
    li.appendChild(time);
    li.appendChild(span);
    list.appendChild(li);
  });
  $('logCount').textContent = CHANGES.length + ' entries';
}

function openLog() {
  logOpen = true;
  renderLog();
  logPanel.hidden = false;
  logScrim.hidden = false;
  requestAnimationFrame(function() { logScrim.classList.add('on'); });
  logBtn.setAttribute('aria-expanded', 'true');
}

function closeLog() {
  logOpen = false;
  logPanel.hidden = true;
  logScrim.classList.remove('on');
  logScrim.hidden = true;
  logBtn.setAttribute('aria-expanded', 'false');
  logBtn.focus({ preventScroll: true });
}

logBtn.onclick = function() {
  if (logOpen) closeLog(); else openLog();
};
logScrim.onclick = closeLog;
$('logClose').onclick = closeLog;

const PRESENT = ORDER.filter(g => GAMES.some(x => x.g === g));
// display and most-significant-first: groups sorted by game count
const GAMES_BY_GROUP = {};
PRESENT.forEach(g => { GAMES_BY_GROUP[g] = GAMES.filter(x => x.g === g).length; });
const GROUPED = PRESENT.slice().sort((a, b) => GAMES_BY_GROUP[b] - GAMES_BY_GROUP[a]);

// one warm palette for every group: red -> violet -> off-white, assigned in order
function lerp3(a, b, t) {
  return [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
}
function toHex(c) {
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function buildRamp(n) {
  const RED = [232, 72, 74], VIOLET = [109, 75, 140], WHITE = [236, 231, 225];
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : i / (n - 1);
    out.push(toHex(t < .5 ? lerp3(RED, VIOLET, t * 2) : lerp3(VIOLET, WHITE, (t - .5) * 2)));
  }
  return out;
}
const RAMP = buildRamp(GROUPED.length);

function accentFor(g) {
  const i = GROUPED.indexOf(g);
  if (i < 0) return 'var(--accent)';
  return RAMP[Math.min(RAMP.length - 1, i)];
}

// shorter names for the chip row on tablet-window widths
const GROUP_SHORT = {
  'Action & Shooters': 'Action',
  'Puzzle & Strategy': 'Puzzle',
  'Racing & Sports': 'Racing',
  'Simulation & Idle': 'Sim',
  'RPG & Story': 'RPG',
  "Five Nights at Freddy's": 'FNaF',
  'Flash Classics': 'Flash',
  'Download Only': 'Downloads'
};

function shortFor(g) {
  return GROUP_SHORT[g] || g;
}

let artFilter = 'all'; // 'all' | 'art' | 'plates'

function artPasses(x) {
  if (artFilter === 'all') return true;
  if (artFilter === 'art') return !!x.i;
  return !x.i;
}

const groupBtns = [];
const viewBtns = [];

function countFor(g) {
  return g === 'All'
    ? GAMES.filter(artPasses).length
    : GAMES.filter(x => x.g === g && artPasses(x)).length;
}

function countView(v) {
  if (v === 'all') return GAMES.length;
  if (v === 'art') return GAMES.filter(x => !!x.i).length;
  return GAMES.filter(x => !x.i).length;
}

function refreshCounts() {
  groupBtns.forEach(b => {
    const n = countFor(b.dataset.group);
    const c = b.querySelector('.filter-count');
    if (c) c.textContent = '(' + n + ')';
    b.classList.toggle('zero', n === 0);
  });
}

['All'].concat(GROUPED).forEach((name, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'group' + (name === 'All' ? ' all' : '');
  b.dataset.group = name;
  b.style.setProperty('--ga', accentFor(name));

  const d = document.createElement('span');
  d.className = 'dot';
  d.setAttribute('aria-hidden', 'true');
  const s = document.createElement('span');
  s.innerHTML = '<span class="lbl">' + escapeHtml(name === 'All' ? 'all' : name) + '</span><span class="lbl-s">' + escapeHtml(name === 'All' ? 'all' : shortFor(name)) + '</span>';
  const c = document.createElement('span');
  c.className = 'filter-count';
  c.textContent = '(' + countFor(name) + ')';

  b.appendChild(d);
  b.appendChild(s);
  b.appendChild(c);
  if (i === 0) b.classList.add('on');
  b.onclick = () => {
    group = name;
    groupBtns.forEach(x => x.classList.toggle('on', x === b));
    settleNext = true;
    render();
  };
  groupBtns.push(b);
  li.appendChild(b);
  filterEl.appendChild(li);
});

const views = [
  { label: 'all tiles', val: 'all' },
  { label: 'with banners', val: 'art' },
  { label: 'plates only', val: 'plates' }
];

views.forEach(v => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'view' + (artFilter === v.val ? ' on' : '');
  b.dataset.view = v.val;
  const s = document.createElement('span');
  s.textContent = v.label;
  const c = document.createElement('span');
  c.className = 'filter-count';
  c.textContent = '(' + countView(v.val) + ')';
  b.appendChild(s);
  b.appendChild(c);
  b.onclick = () => {
    artFilter = v.val;
    viewBtns.forEach(x => x.classList.toggle('on', x === b));
    refreshCounts();
    render();
  };
  viewBtns.push(b);
  li.appendChild(b);
  viewEl.appendChild(li);
});

const shuffleLi = document.createElement('li');
const shuffleBtn = document.createElement('button');
shuffleBtn.type = 'button';
shuffleBtn.className = 'shuffle';
shuffleBtn.title = 'pick one at random';
const shuffleLab = document.createElement('span');
shuffleLab.textContent = 'shuffle';
shuffleBtn.appendChild(shuffleLab);
shuffleBtn.onclick = () => {
  const q = term.trim().toLowerCase();
  const pool = GAMES.filter(x => !x.d && artPasses(x) && (group === 'All' || x.g === group) && matches(x, q));
  if (!pool.length) return;
  openGame(pool[Math.floor(Math.random() * pool.length)]);
};
shuffleLi.appendChild(shuffleBtn);
viewEl.appendChild(shuffleLi);

function matches(x, q) {
  if (!q) return true;
  return x.n.toLowerCase().includes(q) || x.g.toLowerCase().includes(q);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// keep a trailing parenthetical like "(Client / WASM)" on one line
function titleHtml(n) {
  const i = n.indexOf(' (');
  if (i > 0) return escapeHtml(n.slice(0, i)) + ' <span class="nw">' + escapeHtml(n.slice(i + 1)) + '</span>';
  return escapeHtml(n);
}

function render() {
  const q = term.trim().toLowerCase();
  listEl.innerHTML = '';
  if (revealIO) revealIO.disconnect();
  const withReveal = (firstReveal || settleNext) && !REDUCED && !!revealIO;
  let shown = 0;

  GROUPED.forEach(g => {
    if (group !== 'All' && group !== g) return;
    const items = GAMES.filter(x => x.g === g && artPasses(x) && matches(x, q));
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement('section');
    sec.className = 'sect';
    sec.style.setProperty('--ga', accentFor(g));

    const head = document.createElement('div');
    head.className = 'sect-head';
    head.innerHTML = '<h2>' + escapeHtml(g) + '</h2><span class="n">' + items.length + '</span><span class="rule"></span>';

    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(x => {
      const a = document.createElement('a');
      const art = !!x.i;
      a.className = 'card' + (x.d ? ' dl' : '') + (art ? '' : ' plate');
      a.href = x.u;
      a.style.setProperty('--chars', Math.min(46, x.n.length));

      let inner = '';
      if (art) {
        inner += '<span class="card__art" style="background-image:url(images/cards/' + x.i + '.jpg)"></span>';
      }
      inner += '<span class="card__t">' + titleHtml(x.n) + '</span>';
      inner += '<span class="card__s">' + (x.d ? 'download' : (x.s < 1 ? '&lt;1 mb' : x.s + ' mb')) + '</span>';
      inner += '<span class="card__f"></span>';

      const box = document.createElement('span');
      box.className = 'card__in';
      box.innerHTML = inner;
      a.appendChild(box);

      if (x.d) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      } else {
        a.onclick = ev => { ev.preventDefault(); openGame(x); };
      }
      grid.appendChild(a);
    });

    sec.appendChild(head);
    sec.appendChild(grid);
    if (withReveal) sec.classList.add('reveal');
    listEl.appendChild(sec);
  });

  emptyEl.style.display = shown ? 'none' : 'block';
  countEl.textContent = shown === GAMES.length ? GAMES.length + ' games' : shown + ' of ' + GAMES.length;

  const pool = GAMES.filter(x => !x.d && artPasses(x) && (group === 'All' || x.g === group) && matches(x, q));
  shuffleBtn.disabled = pool.length === 0;

  if (settleNext && !REDUCED) {
    listEl.animate(
      [
        { opacity: .45, transform: 'translateY(6px)' },
        { opacity: 1, transform: 'none' }
      ],
      { duration: 200, easing: 'cubic-bezier(.2,.65,.3,1)' }
    );
  }
  settleNext = false;
  firstReveal = false;
  fitTitles();
  renderRecent();

  // never leave sections invisible: force reveal shortly after render
  if (document.querySelector('.sect.reveal:not(.in)')) {
    setTimeout(() => {
      if (revealIO) revealIO.disconnect();
      document.querySelectorAll('.sect.reveal').forEach(s => s.classList.add('in'));
    }, 900);
  }
}

function fitTitles() {
  const titles = listEl.querySelectorAll('.card__t');
  for (let i = 0; i < titles.length; i++) {
    const t = titles[i];
    t.style.fontSize = '';
    let guard = 0;
    while (guard++ < 8) {
      const cs = getComputedStyle(t);
      const lh = parseFloat(cs.lineHeight);
      const h = t.getBoundingClientRect().height;
      if (!lh || h <= lh * 2 + 1) break;
      const fs = parseFloat(cs.fontSize);
      if (fs <= 10.6) break;
      const factor = Math.max(0.72, Math.min(0.97, (lh * 2) / h));
      t.style.fontSize = Math.max(10.6, fs * factor) + 'px';
    }
  }
}

let fitTimer = 0;
addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitTitles, 120);
});

function readRecent() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.filter(n => GAMES.some(g => g.n === n && !g.d));
  } catch (e) {
    return [];
  }
}

function pushRecent(name) {
  const list = readRecent().filter(n => n !== name);
  list.unshift(name);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch (e) {}
  renderRecent();
}

function renderRecent() {
  const list = readRecent();
  const show = list.length > 0 && group === 'All' && !term.trim();
  $('recent').hidden = !show;
  if (!show) return;

  const ul = $('recentList');
  ul.innerHTML = '';
  list.forEach(n => {
    const x = GAMES.find(g => g.n === n);
    if (!x) return;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = x.u;
    a.textContent = n;
    a.style.setProperty('--ga', accentFor(x.g));
    a.onclick = ev => { ev.preventDefault(); openGame(x); };
    li.appendChild(a);
    ul.appendChild(li);
  });
}

let closeTimer = null;
let fadeTimer = null;

function openGame(x) {
  clearTimeout(closeTimer);
  clearTimeout(fadeTimer);
  ovName.textContent = x.n;
  ovNote.hidden = false;
  ovNew.href = x.u;
  frame.classList.remove('ready');
  frame.src = x.u;
  overlay.classList.add('open');
  document.body.classList.add('locked');
  fadeTimer = setTimeout(() => frame.classList.add('ready'), 350);
  history.replaceState(null, '', '#play=' + encodeURIComponent(x.n));
  pushRecent(x.n);
}

function closeGame() {
  clearTimeout(fadeTimer);
  overlay.classList.remove('open');
  ovNote.hidden = true;
  document.body.classList.remove('locked');
  frame.classList.remove('ready');
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => { frame.src = 'about:blank'; }, REDUCED ? 0 : 180);
  history.replaceState(null, '', location.pathname + location.search);
}

$('ovClose').onclick = closeGame;

frame.addEventListener('load', () => {
  ovNote.hidden = true;
  if (overlay.classList.contains('open')) frame.classList.add('ready');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (logOpen) { closeLog(); return; }
    if (overlay.classList.contains('open')) closeGame();
    else if (document.activeElement === $('q') && term) {
      $('q').value = '';
      term = '';
      render();
    }
  }
  if (e.key === '/' && document.activeElement !== $('q')) {
    e.preventDefault();
    $('q').focus();
  }
});

$('q').addEventListener('input', e => { term = e.target.value; render(); });
// Enter in the search box should never reload the page
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

let copyTimer = null;
ovCopy.onclick = () => {
  const url = location.href;
  const done = () => {
    ovCopy.textContent = 'copied';
    ovCopy.classList.add('done');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      ovCopy.textContent = 'copy link';
      ovCopy.classList.remove('done');
    }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, fallback);
  } else {
    fallback();
  }
};

if (!frame.requestFullscreen && !frame.webkitRequestFullscreen) {
  ovFull.hidden = true;
} else {
  ovFull.onclick = () => {
    const el = document.fullscreenElement || document.webkitFullscreenElement;
    if (el) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return;
    }
    const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
    try {
      const p = req.call(frame);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  };
}

function openFromHash() {
  const m = /^#play=(.+)$/.exec(location.hash);
  if (!m) return;
  let name = '';
  try { name = decodeURIComponent(m[1]); } catch (e) { return; }
  const x = GAMES.find(g => g.n === name);
  if (x && !x.d) openGame(x);
}

window.addEventListener('hashchange', () => {
  if (!overlay.classList.contains('open')) openFromHash();
});

const setBtn = $('setBtn');
const setPanel = $('setPanel');
const setSwatch = $('setSwatch');
const setLab = $('setLab');
const rootEl = document.documentElement;
const themeMeta = document.querySelector('meta[name="theme-color"]');
const THEME_KEY = 'backpage:theme';
let themeTimer = null;

const THEMES = [
  { id:'night',  label:'night shift', bg:'#171412' },
  { id:'dusk',   label:'dusk',        bg:'#14121f' },
  { id:'abyss',  label:'abyss',       bg:'#081418' },
  { id:'matcha', label:'matcha',      bg:'#f1f3e6' },
  { id:'day',    label:'daylight',    bg:'#f8f3e9' }
];

function currentTheme() {
  const t = rootEl.getAttribute('data-theme');
  return THEMES.some(x => x.id === t) ? t : 'night';
}

function syncThemes() {
  const now = currentTheme();
  THEMES.forEach(t => {
    const b = setPanel.querySelector('[data-t="' + t.id + '"]');
    if (b) b.setAttribute('aria-checked', t.id === now ? 'true' : 'false');
  });
  setSwatch.className = 'sw sw-' + now;
  const t = THEMES.find(x => x.id === now);
  setLab.textContent = t ? t.label : 'themes';
  if (themeMeta && t) themeMeta.setAttribute('content', t.bg);
}

function openSet() {
  setPanel.hidden = false;
  setBtn.setAttribute('aria-expanded', 'true');
  document.addEventListener('pointerdown', onSetAway, true);
  document.addEventListener('keydown', onSetKey, true);
}

function closeSet() {
  if (setPanel.hidden) return;
  setPanel.hidden = true;
  setBtn.setAttribute('aria-expanded', 'false');
  document.removeEventListener('pointerdown', onSetAway, true);
  document.removeEventListener('keydown', onSetKey, true);
}

function onSetAway(e) {
  if (setBtn.contains(e.target) || setPanel.contains(e.target)) return;
  closeSet();
}

function onSetKey(e) {
  if (e.key === 'Escape') closeSet();
}

setBtn.onclick = () => {
  if (setPanel.hidden) openSet(); else closeSet();
};

const themeBtns = setPanel.querySelectorAll('button[data-t]');
themeBtns.forEach(b => {
  b.onclick = () => {
    const id = b.dataset.t;
    if (!THEMES.some(x => x.id === id)) return;
    rootEl.setAttribute('data-theme', id);
    try { localStorage.setItem(THEME_KEY, id); } catch (e) {}
    syncThemes();
    closeSet();
    if (!REDUCED) {
      rootEl.classList.add('theming');
      clearTimeout(themeTimer);
      themeTimer = setTimeout(() => rootEl.classList.remove('theming'), 280);
    }
  };
});

syncThemes();

render();
openFromHash();
</script>
