<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>UNBLOCKED GAMES</title>
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151d; --panel2:#1c1c26; --line:#2a2a38;
    --txt:#f2f0ea; --dim:#9a96a8; --acc:#ff8a3d; --acc2:#ffc247;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh; overflow-x:hidden;
    background-image:radial-gradient(900px 500px at 15% -10%,rgba(255,138,61,.13),transparent 60%),
                     radial-gradient(700px 400px at 90% 0%,rgba(124,92,255,.10),transparent 60%);
    background-attachment:fixed;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}
  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:rgba(11,11,15,.78);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:18px;padding:16px 0;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.02em;font-size:1.15rem}
  .logo .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    box-shadow:0 0 18px rgba(255,138,61,.7)}
  .logo span{color:var(--acc)}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:.92rem;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,138,61,.14)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .count{font-size:.78rem;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  main{padding:34px 0 70px}
  .hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.02;letter-spacing:-.04em;font-weight:900}
  .hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--acc),var(--acc2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--dim);margin-top:10px;font-size:.95rem;max-width:620px;line-height:1.55}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 22px}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);font-size:.8rem;font-weight:600;cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{color:var(--txt);border-color:#3b3b4d}
  .chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1206;border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
    min-height:112px;padding:16px 16px 14px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(160deg,var(--panel2),var(--panel));cursor:pointer;overflow:hidden;
    transition:transform .16s,border-color .16s,box-shadow .16s;text-decoration:none;color:inherit}
  .card::after{content:"";position:absolute;inset:0;border-radius:14px;padding:1px;
    background:linear-gradient(135deg,rgba(255,138,61,.55),transparent 45%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .16s;pointer-events:none}
  .card:hover{transform:translateY(-3px);border-color:#3d3d52;box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .card:hover::after{opacity:1}
  .card h3{font-size:.98rem;line-height:1.25;letter-spacing:-.01em;font-weight:700}
  .meta{display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .meta .tag{padding:3px 7px;border-radius:5px;background:rgba(255,138,61,.12);color:var(--acc);font-weight:700}
  .meta .tag.dl{background:rgba(124,92,255,.15);color:#b3a2ff}
  .play{position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.06);opacity:0;transition:.16s}
  .card:hover .play{opacity:1}
  .empty{padding:60px 0;text-align:center;color:var(--dim);display:none}
  footer{border-top:1px solid var(--line);padding:24px 0;color:var(--dim);font-size:.78rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  #overlay{position:fixed;inset:0;z-index:100;display:none;background:#08080c;flex-direction:column}
  #overlay.open{display:flex}
  .ov-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .ov-title{font-weight:700;font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--txt);font-size:.8rem;font-weight:600;cursor:pointer;text-decoration:none}
  .ov-btn:hover{border-color:var(--acc);color:var(--acc)}
  #frame{flex:1;width:100%;border:0;background:#000}
  body.locked{overflow:hidden}
  @media(max-width:560px){.count{display:none}.hero h1{font-size:2rem}}
</style>
</head>

const CATS = ['All','Games','FNAF','Deltarune','Emulators','Minecraft','Flash Classics','Vex','Kindergarten','Download Only'];
let cat = 'All', query = '';

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const chips = document.getElementById('chips');
const overlay = document.getElementById('overlay');
const frame = document.getElementById('frame');
const ovTitle = document.getElementById('ovTitle');
const ovNew = document.getElementById('ovNew');

CATS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === 'All' ? ' on' : '');
  b.textContent = c;
  b.onclick = () => { cat = c; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); render(); };
  chips.appendChild(b);
});

function render(){
  const q = query.trim().toLowerCase();
  const list = GAMES.filter(g =>
    (cat === 'All' || g.c === cat) &&
    (!q || g.n.toLowerCase().includes(q) || g.c.toLowerCase().includes(q))
  );
  grid.innerHTML = '';
  list.forEach(g => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.u;
    a.innerHTML = `<div class="play"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      <h3>${escapeHtml(g.n)}</h3>
      <div class="meta"><span class="tag${g.d ? ' dl' : ''}">${escapeHtml(g.c)}</span><span>${g.s} MB</span></div>`;
    if (g.d) {
      a.target = '_blank'; a.rel = 'noopener';
    } else {
      a.onclick = (ev) => { ev.preventDefault(); openGame(g); };
    }
    grid.appendChild(a);
  });
  empty.style.display = list.length ? 'none' : 'block';
  countEl.textContent = list.length + ' / ' + GAMES.length + ' games';
  document.getElementById('foot').textContent = GAMES.length + ' games across 17 archives';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openGame(g){
  ovTitle.textContent = g.n;
  ovNew.href = g.u;
  frame.src = g.u;
  overlay.classList.add('open');
  document.body.classList.add('locked');
  history.replaceState(null, '', '#play=' + encodeURIComponent(g.n));
}
function closeGame(){
  overlay.classList.remove('open');
  document.body.classList.remove('locked');
  frame.src = 'about:blank';
  history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('ovClose').onclick = closeGame;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeGame();
  if (e.key === '/' && document.activeElement !== document.getElementById('q')) { e.preventDefault(); document.getElementById('q').focus(); }
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#play=')) closeGame(); });

render();
</script>
